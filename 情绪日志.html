<head data-page-node-id="S290EywL4AQZuFJfLhTBxT">
<meta charset="UTF-8" data-page-node-id="b5yE8oOqYrWrSRDhOjWiWP">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="Oybt1BWx7LRPvJyT2xv7Dy">
<title>情绪日志</title>
<style>
  :root{
    --cream:#FFF8F3;
    --pink:#F7C6D5;
    --pink-soft:#FDE8EF;
    --lavender:#D9CAF0;
    --lavender-soft:#F2ECFB;
    --ink:#6E5B62;
    --ink-light:#9C8B91;
    --card:rgba(255,255,255,.78);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 600px at 12% -10%, var(--pink-soft) 0%, transparent 55%),
      radial-gradient(900px 700px at 100% 0%, var(--lavender-soft) 0%, transparent 60%),
      linear-gradient(160deg,#FFF9F6 0%,#FDF7FB 50%,#F6F2FC 100%);
    background-attachment:fixed;
    padding:32px 16px 56px;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:560px;}

  /* 顶部计数 */
  .header{text-align:center;margin-bottom:26px;}
  .header h1{
    font-size:15px;font-weight:500;letter-spacing:.28em;
    color:var(--ink-light);margin-bottom:12px;
  }
  .counter{
    display:inline-flex;align-items:baseline;gap:8px;
    background:var(--card);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 8px 26px rgba(190,150,170,.16);
    padding:12px 26px;border-radius:999px;
  }
  .counter .num{
    font-size:30px;font-weight:600;line-height:1;
    background:linear-gradient(120deg,#E998B6,#B79AE0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .counter .txt{font-size:15px;color:var(--ink);}
  .sub{font-size:12.5px;color:var(--ink-light);margin-top:10px;}

  /* 表情选择 */
  .card{
    background:var(--card);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 10px 34px rgba(190,150,170,.14);
    border-radius:var(--radius);
    padding:26px 20px;
  }
  .card-title{
    font-size:14px;font-weight:600;color:var(--ink);
    margin-bottom:18px;display:flex;align-items:center;gap:7px;
  }
  .card-title::before{
    content:"";width:6px;height:16px;border-radius:3px;
    background:linear-gradient(180deg,var(--pink),var(--lavender));
  }
  .moods{display:flex;justify-content:space-between;gap:6px;}
  .mood{
    flex:1;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 2px;border-radius:18px;
    transition:transform .18s ease,background .18s ease;
    font-family:inherit;
  }
  .mood .face{
    font-size:38px;line-height:1;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 3px 6px rgba(180,140,160,.18));
  }
  .mood .name{font-size:12px;color:var(--ink-light);}
  .mood:hover{background:rgba(255,255,255,.75);}
  .mood:hover .face{transform:translateY(-5px) scale(1.14);}
  .mood:active .face{transform:scale(.94);}
  .mood .name{transition:color .18s ease;}
  .mood:hover .name{color:var(--ink);}

  /* 7 天趋势 */
  .trend{margin-top:22px;}
  .trend-row{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px;
  }
  .day{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .day .bubble{
    width:100%;aspect-ratio:1/1;max-width:52px;
    border-radius:50%;
    background:linear-gradient(150deg,#FFFFFF,#FBF3F7);
    border:1px solid rgba(255,255,255,1);
    box-shadow:0 4px 12px rgba(190,150,170,.12);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
  }
  .day.today .bubble{
    background:linear-gradient(150deg,var(--pink-soft),var(--lavender-soft));
    box-shadow:0 4px 14px rgba(199,150,180,.28);
  }
  .day .bubble.empty{font-size:16px;color:#D8CBCE;}
  .day .lb{font-size:11px;color:var(--ink-light);}
  .day.today .lb{color:#D08BA6;font-weight:600;}
  .strip{
    margin-top:16px;padding:12px 14px;border-radius:14px;
    background:rgba(255,255,255,.62);
    font-size:22px;letter-spacing:6px;text-align:center;
    color:var(--ink);min-height:22px;
  }

  /* 今日记录 */
  .list{margin-top:22px;}
  .entries{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
  .entry{
    display:flex;align-items:flex-start;gap:11px;
    padding:11px 13px;border-radius:14px;
    background:rgba(255,255,255,.62);
  }
  .entry .e-face{font-size:22px;line-height:1.2;}
  .entry .e-body{flex:1;min-width:0;}
  .entry .e-note{font-size:13.5px;color:var(--ink);word-break:break-word;white-space:pre-wrap;}
  .entry .e-note.none{color:#C4B3B8;font-style:italic;}
  .entry .e-time{font-size:11.5px;color:var(--ink-light);margin-top:3px;}
  .entry .del{
    background:none;border:none;cursor:pointer;color:#DCC9CE;
    font-size:16px;line-height:1;padding:2px 4px;border-radius:8px;transition:.15s;
  }
  .entry .del:hover{color:#E28AA6;background:rgba(247,198,213,.35);}
  .empty-tip{
    margin-top:10px;text-align:center;font-size:13px;color:#C4B3B8;padding:16px 0;
  }

  /* 弹窗 */
  .mask{
    position:fixed;inset:0;background:rgba(120,95,105,.28);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:50;
  }
  .mask.show{opacity:1;pointer-events:auto;}
  .modal{
    width:100%;max-width:340px;
    background:linear-gradient(160deg,#FFFDFC,#FDF6FA);
    border-radius:24px;padding:26px 24px 22px;
    box-shadow:0 24px 60px rgba(150,110,130,.26);
    transform:translateY(14px) scale(.97);transition:transform .24s cubic-bezier(.34,1.4,.64,1);
    text-align:center;
  }
  .mask.show .modal{transform:translateY(0) scale(1);}
  .modal .big{font-size:52px;line-height:1;margin-bottom:6px;}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:4px;}
  .modal p{font-size:12.5px;color:var(--ink-light);margin-bottom:16px;}
  .modal textarea{
    width:100%;height:88px;resize:none;
    border:1.5px solid #F0E2E8;border-radius:14px;
    padding:11px 13px;font-size:14px;font-family:inherit;
    color:var(--ink);background:#FFFFFF;outline:none;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  .modal textarea:focus{
    border-color:var(--pink);
    box-shadow:0 0 0 3px rgba(247,198,213,.3);
  }
  .modal textarea::placeholder{color:#CFC0C5;}
  .btns{display:flex;gap:9px;margin-top:16px;}
  .btns button{
    flex:1;padding:11px 0;border-radius:13px;font-size:14px;
    font-family:inherit;cursor:pointer;border:none;transition:.16s;
  }
  .btn-cancel{background:#F4ECEF;color:var(--ink-light);}
  .btn-cancel:hover{background:#EDE2E6;}
  .btn-save{
    background:linear-gradient(120deg,#F2A9C0,#C0A3E6);
    color:#fff;font-weight:500;
    box-shadow:0 6px 16px rgba(210,150,180,.32);
  }
  .btn-save:hover{filter:brightness(1.05);transform:translateY(-1px);}

  /* 提示条 */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
    background:rgba(110,91,98,.92);color:#fff;
    padding:10px 20px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.25s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .foot{text-align:center;margin-top:22px;font-size:11.5px;color:#C9B6BB;}

  @media (max-width:420px){
    .mood .face{font-size:32px;}
    .day .bubble{font-size:20px;}
    .strip{font-size:18px;letter-spacing:4px;}
  }
</style>
</head>

<div class="wrap" data-page-node-id="whATiAWAqNZdGSyODOSOY5">

  <div class="header" data-page-node-id="pOgADnddPLx2xddhKDHAn8">
    <h1 data-page-node-id="Rm62VJOECiA7QtfUYJadDj">情绪日志</h1>
    <div class="counter" data-page-node-id="ttzQaAp7rpaErO7fXxtrYY">

<div class="mask" id="mask" data-page-node-id="gE0zZwXCKEGlnUNV70snvD">
  <div class="modal" data-page-node-id="woqXxPBvMBrulADZBt96xj">

<div class="toast" id="toast" data-page-node-id="d2OoxDs8iuB9DHDqrJiMBm"></div>

<script>
(function(){
  "use strict";

  var MOODS = [
    { key:"happy",   emoji:"😊", name:"开心" },
    { key:"neutral", emoji:"😐", name:"平静" },
    { key:"sad",     emoji:"😢", name:"难过" },
    { key:"angry",   emoji:"😡", name:"生气" },
    { key:"tired",   emoji:"😴", name:"疲惫" }
  ];
  var STORE_KEY = "mood_log_entries_v1";
  var WEEK = ["日","一","二","三","四","五","六"];

  var entries = load();
  var pending = null;

  /* ---------- 存储 ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return [];
      var arr = JSON.parse(raw);
      return Object.prototype.toString.call(arr) === "[object Array]" ? arr : [];
    }catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }
    catch(e){ toast("保存失败，浏览器存储不可用"); }
  }

  /* ---------- 工具 ---------- */
  function dateKey(d){
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return y + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
  }
  function sameDay(a, b){ return dateKey(a) === dateKey(b); }
  function timeText(ts){
    var d = new Date(ts), h = d.getHours(), mi = d.getMinutes();
    return (h < 10 ? "0" + h : h) + ":" + (mi < 10 ? "0" + mi : mi);
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  /* ---------- 渲染：表情按钮 ---------- */
  var moodsBox = document.getElementById("moods");
  MOODS.forEach(function(m){
    var b = document.createElement("button");
    b.className = "mood";
    b.type = "button";
    b.title = m.name;
    b.innerHTML = '<span class="face">' + m.emoji + '</span><span class="name">' + m.name + '</span>';
    b.addEventListener("click", function(){ openModal(m); });
    moodsBox.appendChild(b);
  });

  /* ---------- 渲染：主视图 ---------- */
  function render(){
    var now = new Date();
    var today = entries.filter(function(e){ return sameDay(new Date(e.ts), now); });

    // 顶部计数
    document.getElementById("todayCount").textContent = today.length;
    document.getElementById("todayCount2").textContent = today.length;

    var total = entries.length;
    document.getElementById("subInfo").textContent =
      total === 0
        ? "点击下方表情，记下此刻的心情"
        : "累计已记录 " + total + " 次 · " + lastText(now);

    renderTrend(now);
    renderEntries(today);
  }

  function lastText(now){
    if(!entries.length) return "";
    var last = entries[entries.length - 1];
    return "最近一次 " + timeText(last.ts);
  }

  /* ---------- 渲染：7 天趋势 ---------- */
  function renderTrend(now){
    var row = document.getElementById("trendRow");
    var strip = document.getElementById("strip");
    row.innerHTML = "";
    var stripArr = [];

    for(var i = 6; i >= 0; i--){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
      var key = dateKey(d);
      var dayEntries = entries.filter(function(e){ return dateKey(new Date(e.ts)) === key; });
      var top = dayEntries.length ? topMood(dayEntries) : null;

      var cell = document.createElement("div");
      cell.className = "day" + (i === 0 ? " today" : "");
      var face = top ? top.emoji : "·";
      cell.innerHTML =
        '<div class="bubble' + (top ? "" : " empty") + '">' + face + '</div>' +
        '<div class="lb">' + (i === 0 ? "今天" : WEEK[d.getDay()]) + '</div>';
      cell.title = (d.getMonth()+1) + "/" + d.getDate() +
        (dayEntries.length ? " · " + dayEntries.length + " 次记录" : " · 无记录");
      row.appendChild(cell);

      stripArr.push(top ? top.emoji : "·");
    }
    strip.textContent = stripArr.join(" ");
  }

  function topMood(list){
    var stat = {}, order = [];
    list.forEach(function(e){
      if(!stat[e.mood]){ stat[e.mood] = 0; order.push(e.mood); }
      stat[e.mood]++;
    });
    var best = order[0];
    order.forEach(function(k){ if(stat[k] > stat[best]) best = k; });
    for(var i = 0; i < MOODS.length; i++){
      if(MOODS[i].key === best) return MOODS[i];
    }
    return MOODS[0];
  }

  /* ---------- 渲染：今日记录 ---------- */
  function renderEntries(today){
    var box = document.getElementById("entries");
    box.innerHTML = "";
    document.getElementById("emptyTip").style.display = today.length ? "none" : "block";

    today.slice().reverse().forEach(function(e){
      var mood = null;
      for(var i = 0; i < MOODS.length; i++){ if(MOODS[i].key === e.mood) mood = MOODS[i]; }
      if(!mood) return;

      var item = document.createElement("div");
      item.className = "entry";
      var note = (e.note || "").trim();
      item.innerHTML =
        '<span class="e-face">' + mood.emoji + '</span>' +
        '<div class="e-body">' +
          '<div class="e-note' + (note ? "" : " none") + '">' +
            (note ? esc(note) : "（无备注）") +
          '</div>' +
          '<div class="e-time">' + timeText(e.ts) + ' · ' + mood.name + '</div>' +
        '</div>' +
        '<button class="del" type="button" title="删除这条">×</button>';

      item.querySelector(".del").addEventListener("click", function(){
        entries = entries.filter(function(x){ return x.id !== e.id; });
        save(); render(); toast("已删除");
      });
      box.appendChild(item);
    });
  }

  /* ---------- 弹窗 ---------- */
  var mask = document.getElementById("mask");
  var noteEl = document.getElementById("mNote");

  function openModal(mood){
    pending = mood;
    document.getElementById("mFace").textContent = mood.emoji;
    document.getElementById("mTitle").textContent = "此刻：" + mood.name;
    noteEl.value = "";
    mask.classList.add("show");
    setTimeout(function(){ noteEl.focus(); }, 200);
  }
  function closeModal(){
    mask.classList.remove("show");
    pending = null;
  }
  function commit(){
    if(!pending) return;
    entries.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      mood: pending.key,
      note: noteEl.value.trim().slice(0, 500),
      ts: Date.now()
    });
    save();
    var name = pending.name;
    closeModal();
    render();
    toast("已记录：" + name);
  }

  document.getElementById("mCancel").addEventListener("click", closeModal);
  document.getElementById("mSave").addEventListener("click", commit);
  mask.addEventListener("click", function(ev){ if(ev.target === mask) closeModal(); });
  document.addEventListener("keydown", function(ev){
    if(!mask.classList.contains("show")) return;
    if(ev.key === "Escape") closeModal();
    if(ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) commit();
  });
  noteEl.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); commit(); }
  });

  render();
})();
</script>
</body>
