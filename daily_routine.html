<title>每日例行事务看板</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-l:#3b82f6;
    --blue-bg:#eff5ff;
    --orange:#f97316;
    --orange-l:#fb923c;
    --orange-bg:#fff4ec;
    --green:#10b981;
    --red:#ef4444;
    --text:#1f2937;
    --text-2:#6b7280;
    --text-3:#9ca3af;
    --line:#e8edf5;
    --card:#ffffff;
    --radius:18px;
    --shadow:0 4px 18px rgba(37,99,235,.07);
    --shadow-h:0 8px 26px rgba(37,99,235,.13);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:linear-gradient(170deg,#f2f7ff 0%,#f8fbff 40%,#fff8f3 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    padding:18px 14px 60px;
    font-size:15px;
    line-height:1.6;
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* ---------- 顶部 ---------- */
  .hero{
    background:linear-gradient(135deg,var(--blue-l) 0%,var(--blue) 55%,#1d4ed8 100%);
    border-radius:24px;
    padding:22px 20px;
    color:#fff;
    box-shadow:0 10px 28px rgba(37,99,235,.28);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-50px;
    width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle,rgba(249,115,22,.55) 0%,rgba(249,115,22,0) 70%);
  }
  .hero .date{font-size:14px;opacity:.9;letter-spacing:.5px;}
  .hero .day{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:.5px;}
  .hero .quote{
    margin-top:14px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,.25);
    font-size:15px;font-weight:500;
    display:flex;align-items:flex-start;gap:8px;
    position:relative;z-index:1;
  }
  .hero .quote span{flex:1;}
  .refresh{
    background:rgba(255,255,255,.18);border:none;color:#fff;
    width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;
    flex-shrink:0;line-height:1;
  }
  .refresh:active{transform:rotate(180deg);transition:transform .3s;}

  /* ---------- 进度条 ---------- */
  .progress-card{
    margin-top:14px;background:var(--card);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;}
  .progress-top b{font-size:16px;}
  .progress-top .num{color:var(--orange);font-size:20px;font-weight:800;}
  .bar{height:10px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--blue-l),var(--orange));transition:width .45s cubic-bezier(.4,1.3,.5,1);}
  .progress-msg{font-size:13px;color:var(--text-2);margin-top:8px;}

  /* ---------- 通用卡片 ---------- */
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:14px;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin:0 0 4px;}
  .card-sub{font-size:13px;color:var(--text-2);margin:0 0 14px;}

  /* ---------- 睡眠 ---------- */
  .goal{
    background:var(--blue-bg);border-radius:12px;padding:10px 14px;
    font-size:13px;color:var(--blue);font-weight:600;margin-bottom:14px;
    display:flex;align-items:center;gap:8px;
  }
  .time-row{display:flex;gap:10px;}
  .time-box{flex:1;}
  .time-box label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;}
  .time-box input{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;
    font-size:16px;font-family:inherit;color:var(--text);background:#fbfdff;outline:none;
  }
  .time-box input:focus{border-color:var(--blue-l);background:#fff;}
  .btn{
    width:100%;margin-top:14px;padding:13px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--blue-l),var(--blue));
    color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
    box-shadow:0 4px 14px rgba(37,99,235,.3);
  }
  .btn:active{transform:scale(.985);}
  .btn.orange{background:linear-gradient(135deg,var(--orange-l),var(--orange));box-shadow:0 4px 14px rgba(249,115,22,.3);}
  .sleep-result{
    margin-top:14px;padding:14px;border-radius:14px;display:none;
    background:var(--blue-bg);
  }
  .sleep-result.show{display:block;animation:pop .3s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .sleep-result.ok{background:#ecfdf5;}
  .sleep-result.bad{background:#fef2f2;}
  .sr-main{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sr-main.ok{color:var(--green);}
  .sr-main.bad{color:var(--red);}
  .sr-detail{font-size:13px;color:var(--text-2);margin-top:4px;}
  .streak{
    margin-top:14px;display:flex;gap:10px;
  }
  .streak div{
    flex:1;text-align:center;background:#fbfdff;border:1px solid var(--line);
    border-radius:14px;padding:10px 6px;
  }
  .streak b{display:block;font-size:20px;color:var(--orange);line-height:1.2;}
  .streak small{font-size:11px;color:var(--text-3);}

  /* ---------- 任务 ---------- */
  .task{
    border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;
    background:#fbfdff;transition:.25s;
  }
  .task:last-child{margin-bottom:0;}
  .task.done{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-color:#a7f3d0;}
  .task-head{display:flex;align-items:center;gap:12px;}
  .task-emoji{font-size:24px;flex-shrink:0;}
  .task-info{flex:1;min-width:0;}
  .task-name{font-size:16px;font-weight:700;transition:.25s;}
  .task.done .task-name{text-decoration:line-through;color:var(--text-3);}
  .task-desc{font-size:12px;color:var(--text-3);margin-top:1px;}
  .task.done .task-desc{color:#86efac;}
  .cb{
    width:28px;height:28px;flex-shrink:0;border-radius:9px;
    border:2px solid #cbd5e1;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:transparent;transition:.2s;padding:0;
  }
  .task.done .cb{background:var(--green);border-color:var(--green);color:#fff;}
  .cb:active{transform:scale(.9);}
  .note{
    width:100%;margin-top:10px;padding:9px 12px;
    border:1.5px solid var(--line);border-radius:11px;
    font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;
  }
  .note:focus{border-color:var(--orange-l);}
  .note::placeholder{color:#c3cbd8;}

  /* ---------- 本周 ---------- */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .wday{text-align:center;padding:9px 2px;border-radius:13px;background:#fbfdff;border:1.5px solid var(--line);}
  .wday.today{border-color:var(--blue-l);background:var(--blue-bg);box-shadow:0 3px 10px rgba(59,130,246,.18);}
  .wday .wl{font-size:11px;color:var(--text-3);}
  .wday.today .wl{color:var(--blue);font-weight:700;}
  .wday .wd{font-size:13px;font-weight:600;margin:1px 0 4px;}
  .wday .wi{font-size:17px;line-height:1;}
  .wday .wc{font-size:10px;color:var(--text-3);margin-top:3px;}
  .wday.future{opacity:.42;}
  .wday.part .wc{color:var(--orange);font-weight:700;}
  .wday.full .wc{color:var(--green);font-weight:700;}
  .week-tip{font-size:12px;color:var(--text-3);margin-top:12px;text-align:center;}

  footer{text-align:center;margin-top:22px;font-size:12px;color:var(--text-3);}
  footer button{background:none;border:none;color:var(--text-3);font-size:12px;
    text-decoration:underline;cursor:pointer;font-family:inherit;margin-top:6px;}

  @media(max-width:360px){
    body{padding:14px 10px 50px;}
    .task-emoji{font-size:21px;}
    .streak b{font-size:18px;}
  }
</style>
</head>

<script>
(function(){
  'use strict';

  /* ============ 配置 ============ */
  var KEY = 'daily_routine_v1';
  var TARGET_HOURS = 7.5;
  var CYCLE = 1.5;

  var QUOTES = [
    '今天是崭新的一天，加油！',
    '坚持是最大的天赋。',
    '不积跬步，无以至千里。',
    '你不需要很厉害才能开始，但要开始了才会很厉害。',
    '今天的自律，是明天的自由。',
    '慢一点没关系，别停下就好。',
    '状态是干出来的，不是等出来的。',
    '每一个不曾起舞的日子，都是对生命的辜负。'
  ];

  var TASKS = [
    {id:'sport',  emoji:'🏊', name:'运动',          desc:'游泳 / 健身房爬坡', ph:'例如：游泳 1500 米'},
    {id:'xingce', emoji:'📚', name:'学行测',        desc:'行测刷题 / 网课',   ph:'例如：完成逻辑推理 30 题'},
    {id:'intern', emoji:'📮', name:'投实习简历',    desc:'日常实习岗位',       ph:'例如：投递 XX 公司数据分析岗'},
    {id:'autumn', emoji:'🎯', name:'投秋招简历',    desc:'秋招正式批',         ph:'例如：完成 XX 集团网申 + 测评'},
    {id:'paper',  emoji:'📝', name:'写论文/项目报告', desc:'科研产出时间',      ph:'例如：写完第 3 章实验部分'}
  ];

  var WEEK_LABEL = ['一','二','三','四','五','六','日'];

  /* ============ 存储 ============ */
  function loadAll(){
    try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveAll(){
    try{ localStorage.setItem(KEY, JSON.stringify(db)); }
    catch(e){ alert('保存失败：浏览器存储空间不足或被禁用'); }
  }
  var db = loadAll();

  /* ============ 日期工具 ============ */
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayKey(){ return keyOf(new Date()); }
  function getDay(k){
    if(!db[k]) db[k] = {tasks:{}, sleep:null};
    if(!db[k].tasks) db[k].tasks = {};
    return db[k];
  }

  var TK = todayKey();
  var today = getDay(TK);

  /* ============ 顶部日期 & 问候 ============ */
  var now = new Date();
  var WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('dateText').textContent =
    now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日 '+WEEK_CN[now.getDay()];

  var h = now.getHours();
  var greet = h<5 ? '夜深了，早点休息 🌙'
            : h<11 ? '早上好，新的一天开始了 ☀️'
            : h<14 ? '中午好，别忘了吃饭 🍚'
            : h<18 ? '下午好，保持节奏 💪'
            : h<23 ? '晚上好，收个尾吧 🌆'
            : '夜深了，早点休息 🌙';
  document.getElementById('dayText').textContent = greet;

  var qEl = document.getElementById('quoteText');
  function pickQuote(){
    var i = Math.floor(Math.random()*QUOTES.length);
    qEl.textContent = QUOTES[i];
  }
  pickQuote();
  document.getElementById('refreshQuote').addEventListener('click', function(e){
    e.preventDefault(); pickQuote();
  });

  /* ============ 睡眠模块 ============ */
  var sleepRes = document.getElementById('sleepResult');
  var srMain   = document.getElementById('srMain');
  var srDetail = document.getElementById('srDetail');

  function fmtHours(hs){
    var m = Math.round(hs*60);
    var hh = Math.floor(m/60), mm = m%60;
    return hh+' 小时'+(mm>0 ? ' '+mm+' 分钟' : '');
  }

  function calcSleep(s, w){
    var a = s.split(':'), b = w.split(':');
    if(a.length<2 || b.length<2) return null;
    var sMin = parseInt(a[0],10)*60 + parseInt(a[1],10);
    var wMin = parseInt(b[0],10)*60 + parseInt(b[1],10);
    var diff = wMin - sMin;
    if(diff <= 0) diff += 24*60;   // 跨午夜
    return diff/60;
  }

  function renderSleep(){
    var s = today.sleep;
    if(!s){ sleepRes.className='sleep-result'; return; }
    var ok = s.ok;
    sleepRes.className = 'sleep-result show ' + (ok?'ok':'bad');
    srMain.className = 'sr-main ' + (ok?'ok':'bad');
    srMain.textContent = (ok?'✅ 达标':'❌ 未达标') + '　' + fmtHours(s.hours);
    var cycles = Math.round(s.hours/CYCLE*10)/10;
    srDetail.textContent = s.sleepTime+' → '+s.wakeTime
      + '　约 '+cycles+' 个睡眠周期'
      + (ok ? '' : '　还差 '+fmtHours(TARGET_HOURS - s.hours));
    document.getElementById('sleepTime').value = s.sleepTime;
    document.getElementById('wakeTime').value  = s.wakeTime;
  }

  document.getElementById('sleepBtn').addEventListener('click', function(){
    var s = document.getElementById('sleepTime').value;
    var w = document.getElementById('wakeTime').value;
    if(!s || !w){ alert('请填写入睡和起床时间'); return; }
    var hs = calcSleep(s, w);
    if(hs === null){ alert('时间格式有误'); return; }
    today.sleep = {sleepTime:s, wakeTime:w, hours:Math.round(hs*100)/100, ok: hs >= TARGET_HOURS};
    saveAll();
    renderSleep();
    renderStreak();
    renderWeek();
  });

  /* 连续达标天数：今天未达标/未记录时从昨天往前算，不打断 streak */
  function calcStreak(){
    var n = 0, d = new Date();
    var t = db[keyOf(d)];
    if(!(t && t.sleep && t.sleep.ok)) d.setDate(d.getDate()-1);
    while(true){
      var k = keyOf(d), day = db[k];
      if(day && day.sleep && day.sleep.ok){ n++; d.setDate(d.getDate()-1); }
      else break;
      if(n > 3650) break;
    }
    return n;
  }
  function calcBest(){
    var best = 0, cur = 0, d = new Date();
    d.setDate(d.getDate()-365);           // 回溯一年足够
    for(var i=0;i<400;i++){
      var day = db[keyOf(d)];
      if(day && day.sleep && day.sleep.ok){ cur++; if(cur>best) best=cur; }
      else cur = 0;
      d.setDate(d.getDate()+1);
      if(keyOf(d) > TK) break;            // 不算未来
    }
    return best;
  }
  function calcRecords(){
    var n = 0;
    for(var k in db){ if(db[k] && db[k].sleep) n++; }
    return n;
  }
  function renderStreak(){
    document.getElementById('streakNum').textContent  = calcStreak();
    document.getElementById('bestNum').textContent     = Math.max(calcBest(), calcStreak());
    document.getElementById('recordNum').textContent   = calcRecords();
  }

  /* ============ 任务模块 ============ */
  var listEl = document.getElementById('taskList');

  function buildTasks(){
    listEl.innerHTML = '';
    TASKS.forEach(function(t){
      var st = today.tasks[t.id] || (today.tasks[t.id] = {done:false, note:''});

      var el = document.createElement('div');
      el.className = 'task' + (st.done ? ' done' : '');
      el.innerHTML =
        '<div class="task-head">' +
          '<div class="task-emoji">'+t.emoji+'</div>' +
          '<div class="task-info">' +
            '<div class="task-name">'+t.name+'</div>' +
            '<div class="task-desc">'+t.desc+'</div>' +
          '</div>' +
          '<button class="cb" type="button" aria-label="完成">✓</button>' +
        '</div>' +
        '<input class="note" type="text" placeholder="'+t.ph+'" value="">';

      var cb = el.querySelector('.cb');
      var note = el.querySelector('.note');
      note.value = st.note || '';

      cb.addEventListener('click', function(){
        st.done = !st.done;
        el.className = 'task' + (st.done ? ' done' : '');
        saveAll();
        renderProgress();
        renderWeek();
      });

      var timer = null;
      note.addEventListener('input', function(){
        clearTimeout(timer);
        timer = setTimeout(function(){
          st.note = note.value;
          saveAll();
        }, 250);
      });
      note.addEventListener('blur', function(){
        st.note = note.value; saveAll();
      });

      listEl.appendChild(el);
    });
  }

  function doneCount(){
    var n = 0;
    TASKS.forEach(function(t){
      if(today.tasks[t.id] && today.tasks[t.id].done) n++;
    });
    return n;
  }

  var MSGS = [
    '还没开始，先挑一件最小的做起来 💪',
    '开了个头，继续往下推 🚀',
    '两件到手，节奏起来了 👍',
    '完成过半，今天很稳 🔥',
    '就差一件，别松气 ⚡',
    '全部完成！今天的你，配得上想要的一切 🎉'
  ];

  function renderProgress(){
    var n = doneCount();
    document.getElementById('doneNum').textContent = n;
    document.getElementById('barFill').style.width = (n/TASKS.length*100) + '%';
    document.getElementById('progressMsg').textContent = MSGS[n];
  }

  /* ============ 本周回顾 ============ */
  function countOf(k){
    var day = db[k];
    if(!day || !day.tasks) return 0;
    var n = 0;
    TASKS.forEach(function(t){
      if(day.tasks[t.id] && day.tasks[t.id].done) n++;
    });
    return n;
  }

  function renderWeek(){
    var box = document.getElementById('weekBox');
    box.innerHTML = '';
    var monday = new Date();
    monday.setHours(0,0,0,0);
    var off = (monday.getDay()+6)%7;      // 周一=0
    monday.setDate(monday.getDate()-off);

    for(var i=0;i<7;i++){
      var d = new Date(monday.getTime());
      d.setDate(d.getDate()+i);
      var k = keyOf(d);
      var isToday = (k === TK);
      var isFuture = (k > TK);
      var n = countOf(k);

      var cls = 'wday';
      if(isToday) cls += ' today';
      if(isFuture) cls += ' future';
      else if(n === TASKS.length) cls += ' full';
      else if(n > 0) cls += ' part';

      var icon = isFuture ? '·' : (n === TASKS.length ? '✅' : (n === 0 ? '❌' : n+'/5'));
      if(!isFuture && n === 0) icon = '❌';

      var el = document.createElement('div');
      el.className = cls;
      el.innerHTML =
        '<div class="wl">'+WEEK_LABEL[i]+'</div>' +
        '<div class="wd">'+(d.getMonth()+1)+'/'+d.getDate()+'</div>' +
        '<div class="wi">'+icon+'</div>' +
        '<div class="wc">'+(isFuture ? '' : (n === TASKS.length ? '全勤' : n+'/5'))+'</div>';
      box.appendChild(el);
    }
  }

  /* ============ 清空 ============ */
  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!confirm('确定清空今天（'+TK+'）的全部打卡与睡眠记录？此操作不可撤销。')) return;
    delete db[TK];
    saveAll();
    today = getDay(TK);
    buildTasks();
    sleepRes.className = 'sleep-result';
    renderProgress(); renderStreak(); renderWeek();
  });

  /* ============ 跨天自动刷新 ============ */
  setInterval(function(){
    if(keyOf(new Date()) !== TK){
      location.reload();
    }
  }, 60000);

  /* ============ 初始化 ============ */
  buildTasks();
  renderSleep();
  renderProgress();
  renderStreak();
  renderWeek();
})();
</script>
</body>
</html>
