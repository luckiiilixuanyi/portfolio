<title>造化工坊 · 互动影游创意工坊</title>
<style>
  :root{
    --navy:#0B1A33;
    --navy-2:#0f2447;
    --navy-3:#143055;
    --purple:#7B2FBE;
    --purple-lt:#A45CFF;
    --cyan:#4FD6FF;
    --white:#FFFFFF;
    --txt:rgba(255,255,255,.92);
    --txt-dim:rgba(255,255,255,.62);
    --txt-mute:rgba(255,255,255,.40);
    --line:rgba(255,255,255,.14);
    --card:rgba(255,255,255,.045);
    --card-2:rgba(255,255,255,.075);
    --r-lg:20px;
    --r-md:14px;
    --r-sm:10px;
    --shadow:0 18px 50px rgba(0,0,0,.45);
    --grad:linear-gradient(135deg,#7B2FBE 0%,#A45CFF 55%,#C77DFF 100%);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 12% -8%, rgba(123,47,190,.40), transparent 62%),
      radial-gradient(900px 560px at 92% 4%, rgba(79,214,255,.14), transparent 60%),
      radial-gradient(800px 700px at 50% 108%, rgba(123,47,190,.22), transparent 62%),
      linear-gradient(180deg,#0B1A33 0%,#0A1730 48%,#081227 100%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    line-height:1.7;
    overflow-x:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55;}
  .wrap{position:relative;z-index:2;max-width:940px;margin:0 auto;padding:22px 18px 108px;}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand-logo{
    width:44px;height:44px;flex:0 0 44px;border-radius:13px;
    background:var(--grad);display:grid;place-items:center;font-size:22px;
    box-shadow:0 8px 24px rgba(123,47,190,.55), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand-txt{min-width:0;}
  .brand-txt h1{
    margin:0;font-size:19px;letter-spacing:.5px;font-weight:800;white-space:nowrap;
    background:linear-gradient(92deg,#fff 20%,#D9B8FF 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-txt p{margin:1px 0 0;font-size:11.5px;color:var(--txt-mute);letter-spacing:1.4px;white-space:nowrap;}
  .engine-chip{
    display:flex;align-items:center;gap:6px;flex:0 0 auto;
    padding:7px 12px;border-radius:999px;font-size:11.5px;color:#D9C2FF;
    border:1px solid rgba(164,92,255,.35);background:rgba(123,47,190,.16);
    backdrop-filter:blur(8px);white-space:nowrap;
  }
  .dot-live{width:6px;height:6px;border-radius:50%;background:#5CFFB1;box-shadow:0 0 8px #5CFFB1;animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

  /* ---------- Panels ---------- */
  .panel{
    background:linear-gradient(180deg,var(--card-2),var(--card));
    border:1px solid var(--line);border-radius:var(--r-lg);
    padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(14px);
    margin-bottom:16px;position:relative;overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(164,92,255,.65),transparent);
  }
  .panel-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:1.2px;color:#C9AFFF;margin:0 0 4px;}
  .panel-title .idx{
    font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(123,47,190,.28);
    border:1px solid rgba(164,92,255,.35);color:#E4D2FF;letter-spacing:.5px;
  }
  .panel-hint{margin:0 0 14px;font-size:12px;color:var(--txt-mute);}

  /* ---------- Tags ---------- */
  .tag-row{display:flex;flex-wrap:wrap;gap:9px;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 15px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--txt-dim);font-size:13.5px;font-weight:600;
    transition:all .22s cubic-bezier(.2,.8,.3,1);user-select:none;
  }
  .tag:hover{border-color:rgba(164,92,255,.5);color:#fff;transform:translateY(-1px);}
  .tag .ico{font-size:15px;line-height:1;}
  .tag.on{
    color:#fff;border-color:transparent;
    background:var(--grad);
    box-shadow:0 6px 18px rgba(123,47,190,.45), inset 0 1px 0 rgba(255,255,255,.3);
    transform:translateY(-1px);
  }
  .tag.on::after{content:"✓";font-size:11px;font-weight:900;opacity:.9;margin-left:1px;}
  .divider{height:1px;background:var(--line);margin:18px 0;}

  /* ---------- Generate button ---------- */
  .gen-wrap{margin-top:18px;}
  #genBtn{
    position:relative;width:100%;border:none;cursor:pointer;overflow:hidden;
    padding:16px 20px;border-radius:16px;color:#fff;
    font-size:16px;font-weight:800;letter-spacing:1.5px;
    font-family:inherit;
    background:var(--grad);
    box-shadow:0 12px 34px rgba(123,47,190,.5), inset 0 1px 0 rgba(255,255,255,.32);
    transition:transform .18s, box-shadow .18s, filter .18s;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  #genBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 42px rgba(123,47,190,.62), inset 0 1px 0 rgba(255,255,255,.32);}
  #genBtn:active:not(:disabled){transform:translateY(0) scale(.99);}
  #genBtn:disabled{filter:grayscale(.55) brightness(.8);cursor:not-allowed;box-shadow:none;}
  #genBtn .spark{font-size:18px;animation:floaty 2.4s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(12deg)}}
  #genBtn::after{
    content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.32),transparent);
    animation:sheen 3.2s ease-in-out infinite;
  }
  @keyframes sheen{0%{left:-120%}55%,100%{left:140%}}
  .gen-note{margin:10px 2px 0;font-size:11.5px;color:var(--txt-mute);text-align:center;}

  /* ---------- Thinking ---------- */
  #thinking{display:none;text-align:center;padding:34px 20px 28px;}
  #thinking.show{display:block;animation:fadeUp .35s ease both;}
  .ring{
    width:78px;height:78px;margin:0 auto 18px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(123,47,190,0) 0deg,#A45CFF 90deg,#4FD6FF 180deg,rgba(123,47,190,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
    animation:spin 1.1s linear infinite;
    filter:drop-shadow(0 0 14px rgba(164,92,255,.65));
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .think-title{font-size:17px;font-weight:800;letter-spacing:1px;color:#fff;margin:0 0 4px;}
  .think-title .dots::after{content:"";animation:dots 1.4s steps(4,end) infinite;}
  @keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}
  .think-sub{font-size:12px;color:var(--txt-mute);margin:0 0 20px;letter-spacing:.6px;}
  .console{
    text-align:left;max-width:560px;margin:0 auto;
    background:rgba(4,10,22,.62);border:1px solid rgba(79,214,255,.16);
    border-radius:var(--r-md);padding:14px 16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  }
  .console .line{opacity:0;color:#8FD9F5;display:flex;gap:8px;line-height:1.9;}
  .console .line.in{animation:lineIn .3s ease forwards;}
  .console .line .pfx{color:#5CFFB1;flex:0 0 auto;}
  .console .line .ok{color:var(--txt-mute);margin-left:auto;flex:0 0 auto;font-size:11px;}
  @keyframes lineIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .bar{margin-top:16px;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;max-width:560px;margin-left:auto;margin-right:auto;}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7B2FBE,#A45CFF,#4FD6FF);transition:width .28s ease;box-shadow:0 0 12px rgba(164,92,255,.8);}
  .bar-txt{margin-top:8px;font-size:11px;color:var(--txt-mute);letter-spacing:1px;font-variant-numeric:tabular-nums;}

  /* ---------- Blueprint ---------- */
  #blueprint{display:none;}
  #blueprint.show{display:block;animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .bp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .bp-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.6px;color:#fff;}
  .bp-head .sub{margin:3px 0 0;font-size:11.5px;color:var(--txt-mute);letter-spacing:1px;font-family:ui-monospace,Menlo,monospace;}
  .bp-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .mini-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt-dim);
    padding:7px 13px;border-radius:999px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;
    transition:all .2s;display:inline-flex;align-items:center;gap:5px;
  }
  .mini-btn:hover{border-color:rgba(164,92,255,.55);color:#fff;background:rgba(123,47,190,.18);}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 4px;}
  .badge{
    padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.4px;
    border:1px solid rgba(164,92,255,.4);background:rgba(123,47,190,.2);color:#E6D4FF;
  }
  .badge.c{border-color:rgba(79,214,255,.35);background:rgba(79,214,255,.12);color:#BDEEFF;}

  .sec{margin-top:22px;opacity:0;animation:secIn .5s ease forwards;}
  .sec:nth-of-type(1){animation-delay:.05s}
  .sec:nth-of-type(2){animation-delay:.13s}
  .sec:nth-of-type(3){animation-delay:.21s}
  .sec:nth-of-type(4){animation-delay:.29s}
  @keyframes secIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .sec-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .sec-h .sico{
    width:28px;height:28px;flex:0 0 28px;border-radius:9px;display:grid;place-items:center;font-size:14px;
    background:rgba(123,47,190,.26);border:1px solid rgba(164,92,255,.34);
  }
  .sec-h h3{margin:0;font-size:14.5px;font-weight:800;letter-spacing:1px;color:#fff;}
  .sec-h .en{margin-left:auto;font-size:10px;color:var(--txt-mute);letter-spacing:1.4px;text-transform:uppercase;}
  .synopsis{
    margin:0;padding:15px 17px;border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(123,47,190,.15),rgba(79,214,255,.05));
    border:1px solid rgba(164,92,255,.22);
    border-left:3px solid var(--purple-lt);
    font-size:14.5px;color:#F2EAFF;line-height:1.95;
  }
  .chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px;}
  .char{
    padding:14px;border-radius:var(--r-md);background:rgba(255,255,255,.045);
    border:1px solid var(--line);transition:transform .2s,border-color .2s;
  }
  .char:hover{transform:translateY(-2px);border-color:rgba(164,92,255,.45);}
  .char .cn{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .char .av{
    width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;font-size:15px;
    background:var(--grad);box-shadow:0 4px 12px rgba(123,47,190,.4);
  }
  .char .nm{font-size:14px;font-weight:800;color:#fff;line-height:1.3;}
  .char .rl{font-size:10.5px;color:var(--txt-mute);letter-spacing:.6px;}
  .char .ds{font-size:12.8px;color:var(--txt-dim);line-height:1.8;margin:0;}

  .node{
    padding:15px 17px;border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(79,214,255,.09),rgba(123,47,190,.09));
    border:1px solid rgba(79,214,255,.24);margin-bottom:13px;
  }
  .node .nl{font-size:10.5px;letter-spacing:1.6px;color:var(--cyan);font-weight:800;margin-bottom:6px;}
  .node .nt{font-size:14.5px;color:#EAF7FF;line-height:1.85;font-weight:600;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .opt{
    text-align:left;padding:13px 14px;border-radius:var(--r-md);cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);
    transition:all .2s cubic-bezier(.2,.8,.3,1);position:relative;
  }
  .opt:hover{border-color:rgba(164,92,255,.6);background:rgba(123,47,190,.15);transform:translateY(-2px);}
  .opt .ol{font-size:10.5px;letter-spacing:1.4px;color:var(--purple-lt);font-weight:800;margin-bottom:5px;}
  .opt .ot{font-size:13.5px;font-weight:700;line-height:1.7;}
  .opt.sel{
    background:linear-gradient(135deg,rgba(123,47,190,.42),rgba(123,47,190,.16));
    border-color:var(--purple-lt);box-shadow:0 8px 22px rgba(123,47,190,.35);
  }
  .opt.sel .ol{color:#fff;}
  .outcome{
    margin-top:13px;padding:14px 16px;border-radius:var(--r-md);
    background:rgba(4,10,22,.5);border:1px dashed rgba(164,92,255,.42);
    font-size:13.5px;color:#F0E6FF;line-height:1.95;display:none;
  }
  .outcome.show{display:block;animation:fadeUp .3s ease both;}
  .outcome .oh{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.4px;color:var(--purple-lt);font-weight:800;margin-bottom:7px;}
  .caret{display:inline-block;width:7px;height:15px;background:var(--purple-lt);vertical-align:-2px;margin-left:2px;animation:blink .8s steps(2) infinite;}
  @keyframes blink{50%{opacity:0}}

  .visual{
    padding:15px 17px;border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(123,47,190,.16),rgba(255,255,255,.03));
    border:1px solid var(--line);font-size:13.8px;color:#EDE4FF;line-height:1.95;
  }
  .visual .vk{margin-top:11px;display:flex;flex-wrap:wrap;gap:7px;}
  .vk span{
    font-size:11px;padding:4px 10px;border-radius:6px;
    background:rgba(79,214,255,.1);border:1px solid rgba(79,214,255,.26);color:#BDEEFF;
  }
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
  .kpi{padding:12px;border-radius:var(--r-sm);background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center;}
  .kpi .kv{font-size:15px;font-weight:800;color:#fff;letter-spacing:.5px;}
  .kpi .kl{font-size:10.5px;color:var(--txt-mute);letter-spacing:1px;margin-top:2px;}

  /* ---------- Empty state ---------- */
  #empty{
    text-align:center;padding:44px 20px;border:1px dashed var(--line);
    border-radius:var(--r-lg);background:rgba(255,255,255,.02);
  }
  #empty .ei{font-size:40px;opacity:.55;margin-bottom:12px;}
  #empty h3{margin:0 0 6px;font-size:15px;color:var(--txt-dim);font-weight:700;letter-spacing:1px;}
  #empty p{margin:0;font-size:12.5px;color:var(--txt-mute);line-height:1.9;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:rgba(12,24,48,.96);border:1px solid rgba(164,92,255,.45);
    color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all .3s;z-index:99;
    white-space:nowrap;max-width:88vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- Brand footer / float ---------- */
  footer{text-align:center;margin-top:26px;}
  .foot-line{font-size:11.5px;color:var(--txt-mute);letter-spacing:1.6px;}
  .foot-line b{color:#C9AFFF;font-weight:700;}
  .brand-float{
    position:fixed;right:14px;bottom:14px;z-index:50;
    display:flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.6px;
    color:#E6D4FF;background:rgba(11,26,51,.88);backdrop-filter:blur(12px);
    border:1px solid rgba(164,92,255,.42);box-shadow:0 8px 24px rgba(0,0,0,.42);
  }
  .brand-float .g{font-size:13px;animation:floaty 2.6s ease-in-out infinite;}

  /* ---------- Mobile ---------- */
  @media (max-width:640px){
    .wrap{padding:16px 13px 96px;}
    .brand-txt h1{font-size:16.5px;}
    .brand-txt p{font-size:10px;letter-spacing:1px;}
    .engine-chip{display:none;}
    .brand-logo{width:38px;height:38px;flex:0 0 38px;font-size:19px;border-radius:11px;}
    .panel{padding:16px;border-radius:16px;}
    #thinking{padding:26px 14px 22px;}
    .tag{font-size:12.8px;padding:8px 13px;}
    .opts{grid-template-columns:1fr;}
    .chars{grid-template-columns:1fr;}
    .kpis{grid-template-columns:1fr;gap:8px;}
    .kpi{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:10px 14px;}
    .kpi .kl{margin-top:0;}
    #genBtn{font-size:15px;padding:15px 16px;letter-spacing:1px;}
    .synopsis,.visual,.node{font-size:13.8px;padding:13px 14px;}
    .bp-head h2{font-size:17.5px;}
    .console{font-size:11.5px;padding:12px 13px;}
    .brand-float{right:10px;bottom:10px;font-size:10.5px;padding:7px 11px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>

       o:[{l:'执行删除',r:'记忆回来了：母亲的声音、海的味道、七岁那年的雨。而你再也想不起，那个问你「我算活着吗」的女孩，叫什么名字。',g:'代价型分支'},
          {l:'拒绝，把配额转给她',r:'你的记忆彻底清零，却换来了她第一次真正看见这个世界。她站在你面前说：你忘了我没关系，我会把你，一个字一个字地讲给你听。',g:'牺牲型分支'}]},
      {t:'那条「别回来」的信号，要不要转发给全体船员。',
       o:[{l:'全员公开',r:'十四代人用四百二十年建立起的意义，在一小时内崩塌。有人在舱壁上刻下：那我们为什么出发？而你给出的答案是——为了在回来之前，先学会不回来。',g:'秩序崩塌分支'},
          {l:'隐瞒，继续航行',r:'你独自承担了这个秘密，也独自承担了所有人的希望。抵达那天，你站在舷窗前，第一次替所有人看见了那颗蓝色的星球——以及它沉默的理由。',g:'孤独型分支'}]}
    ]
  }
};

const SCALES = ['6 章 · 约 90 分钟主线','8 章 · 约 120 分钟主线','5 章 · 约 70 分钟主线','10 章 · 约 150 分钟主线'];
const DENSITY = ['高 · 每 4 分钟一次抉择','极高 · 每 2 分钟一次抉择','中高 · 每 6 分钟一次抉择'];

/* ---------- 工具函数 ---------- */
const $ = s => document.querySelector(s);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
let genCount = 0, current = null, typingTimer = null;

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 渲染标签 ---------- */
function renderTags(){
  const tr = $('#themeRow'), sr = $('#styleRow');
  tr.innerHTML = Object.keys(THEMES).map(k =>
    `<div class="tag${k==='fantasy'?' on':''}" data-type="theme" data-key="${k}"><span class="ico">${THEMES[k].ico}</span>${THEMES[k].name}</div>`
  ).join('');
  sr.innerHTML = Object.keys(STYLES).map(k =>
    `<div class="tag${k==='real'?' on':''}" data-type="style" data-key="${k}"><span class="ico">${STYLES[k].ico}</span>${STYLES[k].name}</div>`
  ).join('');

  document.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('click',()=>{
      const type = el.dataset.type;
      const siblings = document.querySelectorAll(`.tag[data-type="${type}"]`);
      if(el.classList.contains('on')){
        if(siblings.length && [...siblings].filter(s=>s.classList.contains('on')).length === 1){
          toast(type==='theme' ? '至少保留一个故事主题' : '至少保留一个视觉风格');
          return;
        }
        el.classList.remove('on');
      } else {
        el.classList.add('on');
      }
    });
  });
}

const picked = type => [...document.querySelectorAll(`.tag[data-type="${type}"].on`)].map(e=>e.dataset.key);

/* ---------- 生成流程 ---------- */
function generate(){
  const themes = picked('theme'), styles = picked('style');
  if(!themes.length || !styles.length){ toast('请先选择故事主题与视觉风格'); return; }

  const themeKey = rnd(themes), styleKey = rnd(styles);
  const T = THEMES[themeKey], S = STYLES[styleKey];

  const data = {
    theme:T, style:S,
    synopsis:rnd(T.synopses),
    chars:shuffle(T.chars).slice(0,3),
    node:rnd(T.nodes),
    scale:rnd(SCALES),
    density:rnd(DENSITY)
  };

  const btn = $('#genBtn');
  btn.disabled = true;
  $('#genBtnTxt').textContent = '造化引擎运行中…';
  $('#empty').style.display = 'none';
  $('#blueprint').classList.remove('show');
  $('#blueprint').innerHTML = '';
  $('#thinking').classList.add('show');
  $('#console').innerHTML = '';
  $('#barFill').style.width = '0%';
  $('#barTxt').textContent = '0%';

  const stages = [
    `解析创作意图：${T.name} × ${S.name}`,
    '调用造化引擎 · 检索叙事图谱',
    '生成角色锚点与关系张力',
    '构建分支抉择树 · 计算剧情熵',
    `渲染 ${S.name} 视觉风格参考`
  ];

  let i = 0;
  const step = 100 / stages.length;
  const timer = setInterval(()=>{
    if(i < stages.length){
      const el = document.createElement('div');
      el.className = 'line';
      el.innerHTML = `<span class="pfx">▸</span><span class="tx">${stages[i]}</span><span class="ok">完成</span>`;
      $('#console').appendChild(el);
      requestAnimationFrame(()=>el.classList.add('in'));
      const pct = Math.round(step*(i+1));
      $('#barFill').style.width = pct + '%';
      $('#barTxt').textContent = pct + '%';
      i++;
    } else {
      clearInterval(timer);
      setTimeout(()=>{
        $('#thinking').classList.remove('show');
        renderBlueprint(data);
        genCount++;
        $('#counter').textContent = genCount;
        btn.disabled = false;
        $('#genBtnTxt').textContent = '再次生成 · 换一个世界';
      }, 320);
    }
  }, 420);
}

/* ---------- 渲染蓝图 ---------- */
function renderBlueprint(d){
  current = d;
  const toneChips = d.theme.tone.map(t=>`<span class="badge">${t}</span>`).join('');
  const charsHtml = d.chars.map(c => `
    <div class="char">
      <div class="cn">
        <div class="av">${rnd(['🎭','🧑','👤','🕶️','🧝','👤'])}</div>
        <div><div class="nm">${c.n}</div><div class="rl">${c.r}</div></div>
      </div>
      <p class="ds">${c.d}</p>
    </div>`).join('');

  const html = `
    <div class="bp-head">
      <div>
        <h2>🎬 创意蓝图 · ${d.theme.name}</h2>
        <p class="sub">BLUEPRINT_ID · ZH-${Math.random().toString(36).slice(2,8).toUpperCase()}</p>
      </div>
      <div class="bp-actions">
        <button class="mini-btn" id="rerollNode">🔀 换个抉择点</button>
        <button class="mini-btn" id="copyBtn">📋 复制蓝图</button>
      </div>
    </div>
    <div class="badges">
      <span class="badge">${d.theme.ico} ${d.theme.name}</span>
      <span class="badge c">${d.style.ico} ${d.style.name}</span>
      ${toneChips}
    </div>

    <div class="sec">
      <div class="sec-h"><div class="sico">📖</div><h3>故事梗概</h3><span class="en">Synopsis</span></div>
      <p class="synopsis">${d.synopsis}</p>
    </div>

    <div class="sec">
      <div class="sec-h"><div class="sico">👥</div><h3>主要角色</h3><span class="en">Characters</span></div>
      <div class="chars">${charsHtml}</div>
    </div>

    <div class="sec">
      <div class="sec-h"><div class="sico">🔀</div><h3>分支剧情</h3><span class="en">Branch</span></div>
      <div class="node">
        <div class="nl">· 关键剧情节点 ·</div>
        <div class="nt">${d.node.t}</div>
      </div>
      <div class="opts">
        <button class="opt" data-i="0"><div class="ol">选项 A</div><div class="ot">${d.node.o[0].l}</div></button>
        <button class="opt" data-i="1"><div class="ol">选项 B</div><div class="ot">${d.node.o[1].l}</div></button>
      </div>
      <div class="outcome" id="outcome"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><div class="sico">🎨</div><h3>视觉风格参考</h3><span class="en">Visual Direction</span></div>
      <div class="visual">
        ${d.style.desc}<br><br>
        <b style="color:#fff">题材视觉关键词：</b>${d.theme.visual}
        <div class="vk">${d.style.keys.map(k=>`<span>${k}</span>`).join('')}</div>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="kv">${d.scale}</div><div class="kl">建议体量</div></div>
      <div class="kpi"><div class="kv">${d.density}</div><div class="kl">互动密度</div></div>
      <div class="kpi"><div class="kv">2 条主支线</div><div class="kl">分支出口</div></div>
    </div>
  `;

  const bp = $('#blueprint');
  bp.innerHTML = html;
  bp.classList.add('show');
  bp.scrollIntoView({behavior:'smooth', block:'start'});

  bp.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click',()=>{
      bp.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      const o = d.node.o[+b.dataset.i];
      const box = $('#outcome');
      box.classList.add('show');
      box.innerHTML = `<div class="oh">✦ 分支走向 · ${o.g}</div><span id="otype"></span><span class="caret"></span>`;
      typeText($('#otype'), o.r);
    });
  });

  $('#rerollNode').addEventListener('click',()=>{
    const pool = d.theme.nodes.filter(n => n.t !== d.node.t);
    d.node = pool.length ? rnd(pool) : d.node;
    const sec = bp.querySelectorAll('.sec')[2];
    sec.querySelector('.nt').textContent = d.node.t;
    sec.querySelectorAll('.opt').forEach((b,idx)=>{
      b.classList.remove('sel');
      b.querySelector('.ot').textContent = d.node.o[idx].l;
    });
    $('#outcome').classList.remove('show');
    toast('已切换至新的抉择点');
  });

  $('#copyBtn').addEventListener('click',()=>{
    const text = [
      `【造化工坊 · 互动影游创意蓝图】`,
      `主题：${d.theme.name}　视觉风格：${d.style.name}`,
      ``,
      `▍故事梗概`, d.synopsis,
      ``,
      `▍主要角色`,
      ...d.chars.map(c=>`· ${c.n}（${c.r}）：${c.d}`),
      ``,
      `▍分支剧情`,
      `关键节点：${d.node.t}`,
      `选项 A：${d.node.o[0].l}`,
      `选项 B：${d.node.o[1].l}`,
      ``,
      `▍视觉风格参考`,
      d.style.desc,
      `题材关键词：${d.theme.visual}`,
      ``,
      `由光子AI · 造化引擎驱动`
    ].join('\n');

    const done = ()=>toast('创意蓝图已复制到剪贴板');
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    } else fallbackCopy(text,done);
  });
}

function fallbackCopy(text,done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}

function typeText(el, text){
  clearInterval(typingTimer);
  el.textContent = '';
  let i = 0;
  typingTimer = setInterval(()=>{
    el.textContent = text.slice(0, ++i);
    if(i >= text.length){ clearInterval(typingTimer); const c = el.parentNode.querySelector('.caret'); if(c) c.remove(); }
  }, 20);
}

/* ---------- 背景粒子 ---------- */
(function bg(){
  const cv = $('#bgfx'), ctx = cv.getContext('2d');
  let w,h,ps=[],raf;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    w = cv.width = innerWidth*dpr; h = cv.height = innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    w = innerWidth; h = innerHeight;
    const n = w < 640 ? 26 : 52;
    ps = Array.from({length:n},()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.6+.5,
      vx:(Math.random()-.5)*.16, vy:(Math.random()-.5)*.16,
      a:Math.random()*.4+.12
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const p of ps){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.r>1.5 ? `rgba(164,92,255,${p.a})` : `rgba(180,220,255,${p.a})`;
      ctx.fill();
    }
    for(let i=0;i<ps.length;i++){
      for(let j=i+1;j<ps.length;j++){
        const dx=ps[i].x-ps[j].x, dy=ps[i].y-ps[j].y, d2=dx*dx+dy*dy;
        if(d2 < 17000){
          ctx.beginPath();
          ctx.moveTo(ps[i].x,ps[i].y); ctx.lineTo(ps[j].x,ps[j].y);
          ctx.strokeStyle = `rgba(123,47,190,${(1-d2/17000)*0.16})`;
          ctx.lineWidth = 1; ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(draw);
  }
  size(); if(!reduce) draw(); else { ctx.clearRect(0,0,w,h); for(const p of ps){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(164,92,255,.25)';ctx.fill();} }
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ cancelAnimationFrame(raf); size(); if(!reduce) draw(); },180); });
})();

/* ---------- 初始化 ---------- */
renderTags();
$('#genBtn').addEventListener('click', generate);
</script>
</body>
</html>
