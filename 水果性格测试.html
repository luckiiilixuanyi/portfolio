  height:100vh;

  margin:0 auto;
  overflow:hidden;

    radial-gradient(110% 65% at 92% 12%, #FFE0EC 0%, rgba(255,224,236,0) 62%),

}
.app::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.55) 1.4px, transparent 1.5px);

@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}

/* ---------- 背景漂浮水果 ---------- */
.deco{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.deco span{
  position:absolute;font-size:34px;opacity:.62;
  animation:floaty 7s ease-in-out infinite;
  filter:drop-shadow(0 6px 10px rgba(255,140,110,.18));
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-6deg);}
  50%{transform:translateY(-18px) rotate(8deg);}
}

/* ---------- 封面 ---------- */
#page-cover{justify-content:center;align-items:center;text-align:center;}
.cover-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:999px;
  background:rgba(255,255,255,.75);
  box-shadow:var(--shadow-sm);
  font-size:13px;color:#E8705A;letter-spacing:.5px;
  backdrop-filter:blur(4px);
}
.cover-hero{
  margin:22px 0 6px;position:relative;
  width:210px;height:210px;
  display:flex;align-items:center;justify-content:center;
}
.cover-hero .ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#FFD86B,#FF8FA3,#FFB86B,#FFE9A8,#FFD86B);
  filter:blur(2px);opacity:.85;
  animation:spin 12s linear infinite;
}
.cover-hero .ring2{
  position:absolute;inset:14px;border-radius:50%;
  background:#FFF8EC;box-shadow:inset 0 8px 22px rgba(255,150,110,.18);
}
@keyframes spin{to{transform:rotate(360deg);}}
.cover-hero .fruits{
  position:relative;font-size:82px;line-height:1;
  animation:bouncey 2.6s ease-in-out infinite;
  filter:drop-shadow(0 10px 14px rgba(255,120,90,.22));
}
@keyframes bouncey{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-10px) scale(1.06);}}

.title{
  font-size:38px;font-weight:800;line-height:1.22;margin:14px 0 0;
  letter-spacing:1px;
  background:linear-gradient(100deg,#FF8A3D,#FF5F8D 55%,#FFA63D);

  text-shadow:0 6px 18px rgba(255,140,110,.14);
}
.subtitle{margin:12px 0 0;font-size:16px;color:var(--ink-2);line-height:1.7;}
.subtitle b{color:#F0705C;}

.card-flavors{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  margin-top:20px;padding:14px 16px;
  background:rgba(255,255,255,.7);border-radius:22px;
  box-shadow:var(--shadow-sm);backdrop-filter:blur(6px);
}
.card-flavors i{font-style:normal;font-size:24px;animation:floaty 5s ease-in-out infinite;}

.btn-main{
  margin-top:30px;width:100%;max-width:300px;
  padding:17px 26px;border-radius:999px;
  font-size:19px;font-weight:800;color:#fff;letter-spacing:2px;
  background:linear-gradient(100deg,#FF9A44,#FF6B8B);
  box-shadow:0 12px 26px rgba(255,110,110,.36);
  transition:transform .16s ease,box-shadow .16s ease;
  position:relative;overflow:hidden;
}
.btn-main::before{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}
.btn-main:active{transform:scale(.955);box-shadow:0 6px 16px rgba(255,110,110,.3);}
.cover-tip{margin-top:16px;font-size:12px;color:#B49C8D;}

/* ---------- 答题页 ---------- */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border-radius:50%;
  background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  transition:transform .15s ease;color:var(--ink);
}
.icon-btn:active{transform:scale(.9);}
.step-pill{
  flex:1;text-align:center;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.85);box-shadow:var(--shadow-sm);
  font-size:14px;font-weight:700;color:#F0725C;letter-spacing:.5px;
}
.step-pill em{font-style:normal;font-size:20px;font-weight:800;}

.bar-wrap{
  height:12px;border-radius:999px;background:rgba(255,255,255,.7);
  box-shadow:inset 0 2px 6px rgba(255,150,110,.16);
  overflow:hidden;margin-bottom:22px;
}
.bar{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#FFD86B,#FF9A5B,#FF6B8B);
  box-shadow:0 0 12px rgba(255,140,110,.55);
  transition:width .42s cubic-bezier(.3,1,.4,1);
}

.q-card{
  background:var(--card);border-radius:26px;padding:24px 22px 22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.q-card::before{
  content:"";position:absolute;left:-40px;top:-40px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,216,107,.35),rgba(255,216,107,0) 70%);
}
.q-emoji{
  font-size:44px;display:block;margin-bottom:10px;
  animation:bouncey 2.4s ease-in-out infinite;
}
.q-text{
  position:relative;font-size:22px;font-weight:800;line-height:1.55;margin:0 0 20px;
  letter-spacing:.5px;
}
.q-text small{
  display:block;font-size:13px;font-weight:600;color:#C0A899;margin-bottom:8px;letter-spacing:1px;
}

.opts{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 16px;border-radius:18px;
  background:#FFF9F1;border:2px solid #FFE7D2;
  font-size:16px;font-weight:600;color:var(--ink);line-height:1.4;
  transition:transform .16s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.opt .key{
  flex:0 0 30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#FFD98A,#FFAE7A);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;box-shadow:0 4px 10px rgba(255,160,100,.32);
}
.opt .txt{flex:1;}
.opt:active{transform:scale(.975);}
.opt.picked{
  background:linear-gradient(100deg,#FFE7B8,#FFD3DC);
  border-color:#FF9F7A;
  box-shadow:0 8px 18px rgba(255,150,110,.25);
  transform:scale(.985);
}
.opt.picked .key{background:linear-gradient(135deg,#FF8A3D,#FF5F8D);}
.opt.disabled{pointer-events:none;opacity:.55;}
.opt.disabled.picked{opacity:1;}

.quiz-foot{margin-top:auto;padding-top:22px;text-align:center;font-size:12px;color:#C0A899;}

#page-result{justify-content:flex-start;}

  background:#fff;box-shadow:0 12px 26px rgba(255,140,110,.26);
}
.result-hero .face{

  filter:drop-shadow(0 8px 12px rgba(255,120,90,.2));

}

.r-label{font-size:12px;letter-spacing:3px;color:#C7B0A2;margin-bottom:8px;}
.r-name{

}
.match{

}
.match b{color:#F0725C;font-size:20px;font-weight:800;}

  text-align:center;

.btn-row{display:flex;gap:12px;margin-top:20px;}
.btn-ghost,.btn-solid{
  flex:1;padding:15px 10px;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:1px;
  transition:transform .16s ease,box-shadow .16s ease;
}
.btn-ghost{
  background:#fff;color:#F0725C;box-shadow:var(--shadow-sm);
  border:2px solid #FFDCC8;
}
.btn-solid{

  box-shadow:0 10px 22px rgba(255,110,110,.34);
}
.btn-ghost:active,.btn-solid:active{transform:scale(.96);}

.mask{
  position:absolute;inset:0;z-index:20;display:none;

}
.mask.show{display:flex;animation:fadeIn .25s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%;background:#FFF9F2;border-radius:28px 28px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);

@keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
.sheet-bar{width:44px;height:5px;border-radius:999px;background:#F0DCCB;margin:0 auto 16px;}
.sheet h3{margin:0 0 4px;font-size:18px;text-align:center;}
.sheet .sub{margin:0 0 16px;font-size:12.5px;color:#B49C8D;text-align:center;}
.sheet-item{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:15px 16px;border-radius:18px;background:#fff;margin-bottom:10px;
  box-shadow:var(--shadow-sm);transition:transform .15s ease;
}
.sheet-item:active{transform:scale(.975);}
.sheet-item .ic{
  flex:0 0 42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:linear-gradient(135deg,#FFEBC2,#FFD8E2);
}
.sheet-item .meta{text-align:left;}
.sheet-item .meta b{display:block;font-size:15.5px;}
.sheet-item .meta span{font-size:12px;color:#B49C8D;}
.sheet-cancel{
  width:100%;padding:14px;border-radius:18px;background:#F4E7DA;color:#8A7568;
  font-size:15px;font-weight:700;margin-top:4px;
}

/* 分享图预览层 */
#shotModal .sheet{background:#FFF9F2;padding-bottom:calc(env(safe-area-inset-bottom) + 18px);}
.shot-box{
  max-height:56vh;overflow:auto;text-align:center;margin-bottom:14px;border-radius:18px;
}
.shot-box img{width:100%;max-width:320px;border-radius:18px;display:block;margin:0 auto;box-shadow:var(--shadow);}
.shot-tip{font-size:12.5px;color:#B49C8D;text-align:center;margin:0 0 12px;line-height:1.6;}

/* 吐司 */
.toast{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);
  transform:translate(-50%,14px);z-index:40;
  padding:11px 20px;border-radius:999px;background:rgba(74,59,50,.9);color:#fff;
  font-size:14px;opacity:0;pointer-events:none;transition:all .28s ease;white-space:nowrap;
  max-width:88%;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* 结果页彩纸 */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:5;}
.confetti i{
  position:absolute;bottom:-30px;font-size:22px;font-style:normal;
  animation:rise linear forwards;
}
@keyframes rise{
  0%{transform:translateY(0) rotate(0deg);opacity:0;}
  12%{opacity:1;}
  100%{transform:translateY(-115vh) rotate(420deg);opacity:0;}
}

@media (max-height:680px){
  .cover-hero{width:160px;height:160px;}
  .cover-hero .fruits{font-size:64px;}
  .title{font-size:31px;}
  .result-hero{width:132px;height:132px;}
  .result-hero .face{font-size:62px;}
  .q-text{font-size:19px;}
}
</style>

function show(pageId){

function renderQuestion(){
  locked = false;
  const q = QUESTIONS[curIndex];
  $('qIndex').textContent = curIndex + 1;
  $('qNo').textContent = 'QUESTION ' + String(curIndex+1).padStart(2,'0');
  $('qEmoji').textContent = Q_EMOJI[curIndex];
  $('qText').textContent = q.q;
  $('bar').style.width = (curIndex / QUESTIONS.length * 100) + '%';
  $('btnBack').style.visibility = curIndex === 0 ? 'hidden' : 'visible';

  const box = $('opts');
  box.innerHTML = '';
  q.o.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="key">${KEYS[i]}</span><span class="txt">${opt.t}</span>`;
    btn.addEventListener('click', ()=>pick(btn, i, opt));
    box.appendChild(btn);
  });
}

function pick(btn, i, opt){
  if (locked) return;
  locked = true;
  answers[curIndex] = opt.f;

  [...$('opts').children].forEach(b=>{
    b.classList.add('disabled');
    if (b === btn) b.classList.add('picked');
  });

  $('bar').style.width = ((curIndex + 1) / QUESTIONS.length * 100) + '%';

  setTimeout(()=>{
    if (curIndex < QUESTIONS.length - 1){
      curIndex++;
      renderQuestion();
      $('page-quiz').scrollTop = 0;
    } else {
      calcResult();
    }

}

   ========================================================= */
function calcResult(){
  const score = {};
  answers.forEach(f=>{ score[f] = (score[f] || 0) + 1; });

  let best = FRUITS[0], bestScore = -1;
  FRUITS.forEach(f=>{
    const s = score[f.id] || 0;
    if (s > bestScore){ bestScore = s; best = f; }
  });

  result = best;
  // 契合度：命中占比映射到 70~99，保证观感
  const pct = Math.min(99, Math.round(70 + (bestScore / QUESTIONS.length) * 100));
  renderResult(pct);
  show('page-result');
  $('page-result').scrollTop = 0;
  boom();
}

function copy(str, okMsg){

    navigator.clipboard.writeText(str).then(done).catch(()=>fallbackCopy(str, done));
  } else {

  }
}
function fallbackCopy(str, cb){

  try { document.execCommand('copy'); cb(); }

}

/* =========================================================
   Canvas 绘制分享卡（无外部依赖）
   ========================================================= */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapText(ctx, text, x, y, maxW, lh){
  let line = '';
  const lines = [];
  for (const ch of text){
    if (ctx.measureText(line + ch).width > maxW){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lh));
  return lines.length;
}
function drawShareCard(){
  const c = $('shotCanvas');
  const ctx = c.getContext('2d');
  const W = 750, H = 1180;
  c.width = W; c.height = H;
  const f = result;
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji"';
  const CN_FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

  // 背景
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#FFF6E3');
  g.addColorStop(.48,'#FFE3EC');
  g.addColorStop(1,'#FFEBC8');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 背景光斑
  [[120,140,'#FFD86B',120],[640,240,'#FFB3C6',150],[80,900,'#FFD1A8',110],[660,980,'#FFC9D9',130]]
    .forEach(p=>{
      ctx.globalAlpha = .45;
      ctx.fillStyle = p[2];
      ctx.beginPath(); ctx.arc(p[0],p[1],p[3],0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });

  // 背景装饰水果
  ctx.font = '52px ' + EMOJI_FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = .8;
  const decoPos = [[70,220,'🍓'],[680,180,'🍊'],[60,700,'🍇'],[690,660,'🍒'],[100,1080,'🥭'],[650,1100,'🫐']];
  decoPos.forEach(p=> ctx.fillText(p[2], p[0], p[1]));
  ctx.globalAlpha = 1;

  // 顶部标题
  ctx.fillStyle = '#E8705A';
  ctx.font = '600 30px ' + CN_FONT;
  ctx.fillText('🍉 水果性格测试', W/2, 92);

  ctx.fillStyle = '#B49C8D';
  ctx.font = '400 24px ' + CN_FONT;
  ctx.fillText('12 道题 · 15 种水果人格', W/2, 136);

  // 白色卡片
  const cx = 66, cy = 200, cw = W - 132, ch = 800;
  ctx.save();
  ctx.shadowColor = 'rgba(255,140,110,.28)';
  ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#FFFFFF';
  roundRect(ctx, cx, cy, cw, ch, 48); ctx.fill();
  ctx.restore();

  // 卡片顶部色条
  ctx.save();
  roundRect(ctx, cx, cy, cw, ch, 48); ctx.clip();
  const tg = ctx.createLinearGradient(cx, cy, cx + cw, cy);
  tg.addColorStop(0, f.c1); tg.addColorStop(1, f.c2);
  ctx.fillStyle = tg; ctx.fillRect(cx, cy, cw, 10);
  ctx.restore();

  // 头像圆
  const ax = W/2, ay = cy + 150;
  ctx.save();
  ctx.shadowColor = 'rgba(255,140,110,.35)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  const ag = ctx.createRadialGradient(ax-30, ay-30, 10, ax, ay, 96);
  ag.addColorStop(0, f.c1); ag.addColorStop(1, f.c2);
  ctx.fillStyle = ag;
  ctx.beginPath(); ctx.arc(ax, ay, 92, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.arc(ax, ay, 76, 0, Math.PI*2); ctx.fill();
  ctx.font = '96px ' + EMOJI_FONT;
  ctx.fillText(f.emoji, ax, ay + 6);

  // 名称
  let y = ay + 140;
  ctx.fillStyle = '#4A3B32';
  ctx.font = '800 52px ' + CN_FONT;
  ctx.fillText(f.name, ax, y);

  // 人格称号
  y += 62;
  ctx.font = '700 30px ' + CN_FONT;
  const tw = ctx.measureText(f.title).width + 56;
  roundRect(ctx, ax - tw/2, y - 30, tw, 58, 29);
  const bg = ctx.createLinearGradient(ax - tw/2, 0, ax + tw/2, 0);
  bg.addColorStop(0,'rgba(255,216,107,.30)'); bg.addColorStop(1,'rgba(255,143,163,.30)');
  ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = '#E8705A';
  ctx.fillText(f.title, ax, y);

  // 描述
  y += 96;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#FFF8EE';
  roundRect(ctx, cx + 36, y - 26, cw - 72, 240, 26); ctx.fill();
  ctx.fillStyle = '#6B584C';
  ctx.font = '400 28px ' + CN_FONT;
  wrapText(ctx, f.desc, cx + 66, y, cw - 132, 50);

  // 标签
  ctx.textBaseline = 'middle';
  let tx = cx + 60, ty = y + 274;
  ctx.font = '700 26px ' + CN_FONT;
  f.tags.forEach(t=>{
    const label = '#' + t;
    const w = ctx.measureText(label).width + 44;
    if (tx + w > cx + cw - 60){ tx = cx + 60; ty += 66; }
    const bgd = ctx.createLinearGradient(tx, 0, tx + w, 0);
    bgd.addColorStop(0, f.c1); bgd.addColorStop(1, f.c2);
    ctx.fillStyle = bgd;
    roundRect(ctx, tx, ty - 26, w, 52, 26); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.fillText(label, tx + w/2, ty + 1);
    tx += w + 16;
  });

  // 卡内 footer
  ctx.textAlign = 'center';
  ctx.fillStyle = '#B49C8D';
  ctx.font = '400 22px ' + CN_FONT;
  ctx.fillText('找到你的本命水果 🍓', ax, cy + ch - 44);

  // 底部引导
  ctx.fillStyle = '#8A7568';
  ctx.font = '400 24px ' + CN_FONT;
  ctx.fillText('长按识别 · 测测你是什么水果', W/2, H - 108);
  ctx.fillStyle = '#C0A899';
  ctx.font = '400 20px ' + CN_FONT;
  ctx.fillText('🍉 水果性格测试 · 12 道题解锁你的水果人格', W/2, H - 66);

  return c.toDataURL('image/png');
}
