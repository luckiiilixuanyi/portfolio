<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="B5Ei1L3GBg7oF9MKUWCCAH">
<head data-page-node-id="YQNsOCOvS5kPdcXlKdPS4q">

<title>WeGame AI 游戏推荐器</title>
<style>
  :root{
    --navy-900:#0e1922;
    --navy-800:#122130;
    --navy-700:#1a2a3a;
    --navy-600:#22354a;
    --gold:#D4AF37;
    --gold-lt:#F2D680;
    --gold-dk:#A8862B;
    --white:#ffffff;
    --txt:#e8eef5;
    --txt-dim:#9fb2c4;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(212,175,55,.14), transparent 60%),
      radial-gradient(800px 500px at 92% 4%, rgba(58,140,220,.14), transparent 60%),
      linear-gradient(180deg,var(--navy-900) 0%, var(--navy-700) 45%, #101c27 100%);
    background-attachment:fixed;
    color:var(--txt);
    min-height:100vh;
    line-height:1.6;
    overflow-x:hidden;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 120px;}

  /* ---------- Header ---------- */
  header{text-align:center;margin-bottom:28px;}
  .logo-line{display:flex;align-items:center;justify-content:center;gap:10px;}
  .logo-mark{
    width:44px;height:44px;border-radius:12px;flex:0 0 44px;
    background:linear-gradient(145deg,var(--gold-lt),var(--gold-dk));
    display:grid;place-items:center;font-size:24px;
    box-shadow:0 6px 20px rgba(212,175,55,.34);
  }
  h1{
    margin:0;font-size:26px;letter-spacing:1px;font-weight:800;
    background:linear-gradient(90deg,#fff,var(--gold-lt) 60%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin:8px 0 0;font-size:13.5px;color:var(--txt-dim);}
  .sub b{color:var(--gold);font-weight:600;}

  /* ---------- Panel ---------- */
  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid rgba(212,175,55,.20);
    border-radius:var(--radius);
    padding:20px 18px;
    backdrop-filter:blur(6px);
    box-shadow:0 18px 46px rgba(0,0,0,.34);
  }
  .group + .group{margin-top:20px;padding-top:20px;border-top:1px dashed rgba(255,255,255,.10);}
  .group-head{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap;}
  .group-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.5px;}
  .group-hint{font-size:12px;color:var(--txt-dim);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}

  .tags{display:flex;flex-wrap:wrap;gap:10px;}
  .tag{
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.045);
    color:var(--txt);
    padding:8px 15px;border-radius:999px;
    font-size:13.5px;cursor:pointer;
    transition:transform .16s ease, background .2s, border-color .2s, color .2s, box-shadow .2s;
    display:inline-flex;align-items:center;gap:6px;
    user-select:none;
  }
  .tag .ic{font-size:14px;line-height:1;}
  .tag:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.6);background:rgba(212,175,55,.10);}
  .tag.on{
    background:linear-gradient(135deg,var(--gold-lt),var(--gold-dk));
    color:#20180a;font-weight:700;border-color:transparent;
    box-shadow:0 6px 18px rgba(212,175,55,.36);
  }
  .tag.on::after{content:"✓";font-size:11px;font-weight:900;}
  .tag.style.on{background:linear-gradient(135deg,#5fb0f5,#2b6fb5);color:#04121f;box-shadow:0 6px 18px rgba(88,164,240,.34);}

  /* ---------- Action bar ---------- */
  .actions{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .btn-ai{
    position:relative;overflow:hidden;
    border:none;cursor:pointer;
    padding:15px 52px;border-radius:999px;
    font-size:17px;font-weight:800;letter-spacing:2px;color:#21190a;
    background:linear-gradient(135deg,#FFF0BE,var(--gold) 45%,var(--gold-dk));
    box-shadow:0 10px 30px rgba(212,175,55,.42), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .16s ease, box-shadow .2s;
  }
  .btn-ai:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 38px rgba(212,175,55,.56);}
  .btn-ai:active{transform:translateY(0) scale(.99);}
  .btn-ai::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);
    transform:translateX(-120%);
  }
  .btn-ai:hover::before{animation:shine .9s ease;}
  @keyframes shine{to{transform:translateX(120%);}}
  .btn-ai[disabled]{opacity:.6;cursor:not-allowed;transform:none;animation:none;}
  .btn-ai .spark{font-size:18px;margin-right:6px;}
  .sel-info{font-size:12.5px;color:var(--txt-dim);min-height:20px;text-align:center;}
  .sel-info b{color:var(--gold-lt);}
  .link-row{display:flex;gap:16px;}
  .link-btn{
    background:none;border:none;color:var(--txt-dim);font-size:12.5px;cursor:pointer;
    padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.22);
  }
  .link-btn:hover{color:var(--gold);border-color:var(--gold);}

  /* ---------- Result stage ---------- */
  .stage{margin-top:26px;min-height:80px;}
  .thinking{
    display:flex;flex-direction:column;align-items:center;gap:16px;
    padding:38px 20px;
    border-radius:var(--radius);
    border:1px solid rgba(212,175,55,.22);
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  }
  .thinking .bot{font-size:46px;animation:bounce 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(212,175,55,.45));}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-11px) rotate(4deg);}}
  .thinking .line{font-size:15px;color:var(--gold-lt);font-weight:600;letter-spacing:.5px;}
  .thinking .line::after{content:"";animation:dots 1.2s steps(4,end) infinite;}
  @keyframes dots{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}
  .bar{width:min(320px,80%);height:6px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;}
  .bar i{display:block;height:100%;width:30%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold-lt),var(--gold));
    animation:slide 2s ease-in-out forwards;}
  @keyframes slide{0%{width:4%;margin-left:0;}100%{width:100%;margin-left:0;}}
  .steps{font-size:12px;color:var(--txt-dim);min-height:18px;font-family:ui-monospace,Menlo,monospace;}

  .result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .result-head h2{margin:0;font-size:17px;color:#fff;}
  .result-head h2 span{color:var(--gold);}
  .result-head p{margin:2px 0 0;font-size:12.5px;color:var(--txt-dim);}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .card{
    position:relative;overflow:hidden;
    border-radius:var(--radius);
    border:1px solid rgba(212,175,55,.20);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    padding:18px 16px 16px;
    display:flex;flex-direction:column;gap:11px;
    box-shadow:0 14px 34px rgba(0,0,0,.32);
    animation:pop .45s cubic-bezier(.2,.9,.3,1.2) backwards;
    transition:transform .22s ease, border-color .22s, box-shadow .22s;
  }
  .card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.6);box-shadow:0 20px 44px rgba(0,0,0,.45);}
  .card:nth-child(1){animation-delay:.02s;}
  .card:nth-child(2){animation-delay:.14s;}
  .card:nth-child(3){animation-delay:.26s;}
  @keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold-lt),var(--gold),transparent);
  }
  .rank{
    position:absolute;top:12px;right:12px;
    font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;
    background:rgba(212,175,55,.16);color:var(--gold-lt);border:1px solid rgba(212,175,55,.35);
  }
  .c-top{display:flex;align-items:center;gap:12px;}
  .c-emoji{
    width:48px;height:48px;flex:0 0 48px;border-radius:13px;font-size:25px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(212,175,55,.22),rgba(212,175,55,.05));
    border:1px solid rgba(212,175,55,.28);
  }
  .c-name{margin:0;font-size:16.5px;font-weight:800;color:#fff;line-height:1.35;}
  .c-meta{margin:2px 0 0;font-size:11.5px;color:var(--txt-dim);}
  .c-meta b{color:var(--gold-lt);font-size:13px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:11px;padding:3px 9px;border-radius:99px;
    background:rgba(212,175,55,.13);color:var(--gold-lt);border:1px solid rgba(212,175,55,.26);
  }
  .chip.s{background:rgba(95,176,245,.13);color:#9fd0ff;border-color:rgba(95,176,245,.28);}
  .chip.hit{background:linear-gradient(135deg,var(--gold-lt),var(--gold-dk));color:#231a08;font-weight:700;border-color:transparent;}
  .c-desc{margin:0;font-size:13px;color:#c8d6e3;line-height:1.65;}
  .reason{
    display:flex;gap:8px;align-items:flex-start;
    background:rgba(0,0,0,.24);border-left:3px solid var(--gold);
    border-radius:0 10px 10px 0;padding:10px 12px;
  }
  .reason .ri{font-size:14px;line-height:1.5;}
  .reason p{margin:0;font-size:12.5px;color:#dfc98d;line-height:1.65;}
  .reason b{color:#fff;background:rgba(212,175,55,.24);padding:0 5px;border-radius:4px;font-weight:700;}
  .c-foot{margin-top:auto;padding-top:6px;font-size:11.5px;color:var(--txt-dim);display:flex;justify-content:space-between;align-items:center;}
  .score{color:var(--gold);font-weight:800;font-size:14px;}

  .empty{
    text-align:center;padding:36px 20px;color:var(--txt-dim);font-size:13.5px;
    border:1px dashed rgba(255,255,255,.14);border-radius:var(--radius);
  }
  .empty .e-ic{font-size:34px;display:block;margin-bottom:10px;opacity:.8;}

  /* ---------- 蛋蛋君 ---------- */
  .egg{
    position:fixed;right:20px;bottom:20px;z-index:60;
    display:flex;align-items:center;gap:10px;flex-direction:row-reverse;
  }
  .egg-btn{
    width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
    font-size:29px;line-height:1;
    background:linear-gradient(145deg,var(--gold-lt),var(--gold-dk));
    box-shadow:0 8px 24px rgba(212,175,55,.45), inset 0 1px 0 rgba(255,255,255,.6);
    animation:float 3s ease-in-out infinite;
    display:grid;place-items:center;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .egg-btn:active{transform:scale(.94);}
  .bubble{
    position:relative;max-width:220px;
    background:linear-gradient(135deg,#fdf7e2,#f0e0ae);
    color:#3a2c10;font-size:13px;font-weight:600;line-height:1.5;
    padding:11px 14px;border-radius:14px;
    box-shadow:0 10px 26px rgba(0,0,0,.38);
    opacity:0;transform:translateY(8px) scale(.9);transform-origin:right center;
    transition:opacity .22s ease, transform .22s ease;
    pointer-events:none;white-space:normal;
  }
  .bubble::after{
    content:"";position:absolute;right:-7px;top:50%;margin-top:-7px;
    border:7px solid transparent;border-left-color:#f7ecc9;border-right:0;
  }
  .egg:hover .bubble,.egg.show .bubble{opacity:1;transform:translateY(0) scale(1);}

  footer{text-align:center;margin-top:34px;font-size:11.5px;color:rgba(159,178,196,.6);}

  /* ---------- 移动端 ---------- */
  @media (max-width:820px){
    .cards{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:600px){
    .wrap{padding:20px 13px 110px;}
    h1{font-size:21px;}
    .sub{font-size:12.5px;}
    .panel{padding:16px 13px;}
    .tag{padding:7px 13px;font-size:13px;}
    .btn-ai{width:100%;padding:15px 20px;font-size:16px;letter-spacing:1px;}
    .cards{grid-template-columns:1fr;}
    .egg{right:13px;bottom:13px;}
    .egg-btn{width:52px;height:52px;font-size:25px;}
    .bubble{max-width:170px;font-size:12px;}
    .rank{top:10px;right:10px;}
  }
</style>
</head>

  /* ============ 状态 ============ */
  var selG = [], selS = [], lastPicks = [];
  var $ = function(id){ return document.getElementById(id); };
  var stage = $('stage'), aiBtn = $('aiBtn'), selInfo = $('selInfo');

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function pickRandom(arr,n){ return shuffle(arr.slice()).slice(0,n); }

  /* ============ 渲染标签 ============ */
  function buildTags(){
    var gh = $('genreTags'), sh = $('styleTags');
    GENRES.forEach(function(t){
      var b=document.createElement('button');
      b.className='tag'; b.type='button'; b.dataset.k='g'; b.dataset.v=t.id;
      b.setAttribute('aria-pressed','false');
      b.innerHTML='<span class="ic">'+t.ic+'</span>'+t.id;
      gh.appendChild(b);
    });
    STYLES.forEach(function(t){
      var b=document.createElement('button');
      b.className='tag style'; b.type='button'; b.dataset.k='s'; b.dataset.v=t.id;
      b.setAttribute('aria-pressed','false');
      b.innerHTML='<span class="ic">'+t.ic+'</span>'+t.id;
      sh.appendChild(b);
    });
    document.addEventListener('click', function(e){
      var el = e.target.closest ? e.target.closest('.tag') : null;
      if(!el) return;
      var k = el.dataset.k, v = el.dataset.v;
      var arr = (k==='g') ? selG : selS;
      var i = arr.indexOf(v);
      if(i>=0){ arr.splice(i,1); el.classList.remove('on'); el.setAttribute('aria-pressed','false'); }
      else { arr.push(v); el.classList.add('on'); el.setAttribute('aria-pressed','true'); }
      updateSelInfo();
    });
  }

  function updateSelInfo(){
    var n = selG.length + selS.length;
    if(!n){ selInfo.innerHTML = '还没选择任何标签，也可以直接让 AI 盲推一波 👀'; return; }
    selInfo.innerHTML = '已选 <b>'+n+'</b> 个标签：' +
      (selG.length? '类型 '+selG.map(function(x){return '<b>'+x+'</b>';}).join('、') : '') +
      (selG.length&&selS.length? ' ｜ ' : '') +
      (selS.length? '风格 '+selS.map(function(x){return '<b>'+x+'</b>';}).join('、') : '');
  }

  /* ============ 匹配算法 ============ */
  function scoreGame(gm){
    var gs=0, ss=0;
    gm.g.forEach(function(x){ if(selG.indexOf(x)>=0) gs++; });
    gm.s.forEach(function(x){ if(selS.indexOf(x)>=0) ss++; });
    return { score: gs*3 + ss*2, gs:gs, ss:ss };
  }
  function pctOf(sc){
    var total = selG.length*3 + selS.length*2;
    if(!total) return 68 + Math.floor(Math.random()*22);
    var p = Math.round(52 + (sc.score/total)*46);
    return Math.max(48, Math.min(99, p));
  }
  function recommend(){
    var pool = GAMES.map(function(gm){
      var s = scoreGame(gm);
      return { gm:gm, score:s.score + Math.random()*1.4, gs:s.gs, ss:s.ss };
    });
    if(lastPicks.length){
      var fresh = pool.filter(function(x){ return lastPicks.indexOf(x.gm.n)<0; });
      if(fresh.length >= 3) pool = fresh;
    }
    pool.sort(function(a,b){ return b.score - a.score; });
    // 头部内做轻微随机，保证"换一批"有新鲜感
    var top = pool.slice(0, 10);
    var rest = pool.slice(10);
    var out = pickRandom(top, 3);
    out.sort(function(a,b){ return b.score - a.score; });
    lastPicks = out.map(function(x){ return x.gm.n; });
    return { list: out, rest: rest };
  }

  /* ============ 渲染结果 ============ */
  function reasonText(gm, gs, ss){
    var hitG = gm.g.filter(function(x){ return selG.indexOf(x)>=0; });
    var hitS = gm.s.filter(function(x){ return selS.indexOf(x)>=0; });
    var head;
    if(hitG.length && hitS.length)
      head = '根据你对 <b>'+hitG.join('</b>、<b>')+'</b> 和 <b>'+hitS.join('</b>、<b>')+'</b> 的偏好，我们推荐这款游戏。';
    else if(hitG.length)
      head = '根据你对 <b>'+hitG.join('</b>、<b>')+'</b> 的偏好，我们推荐这款游戏。';
    else if(hitS.length)
      head = '根据你对 <b>'+hitS.join('</b>、<b>')+'</b> 的偏好，我们推荐这款游戏。';
    else
      head = '你还没锁定偏好，这是本周 WeGame 热度最高的作品之一，先试试看。';
    return '<p><span class="ri">💡</span><span>'+head+' '+gm.h+'</span></p>';
  }

  function renderCards(res){
    var html = '<div class="result-head">' +
      '<div><h2>🎯 AI 为你挑了 <span>3</span> 款</h2>' +
      '<p>匹配自本地 '+GAMES.length+' 款游戏库 · 点击「换一批」看看别的选择</p></div>' +
      '<button class="link-btn" id="moreBtn">🔄 换一批</button></div>' +
      '<div class="cards">';

    res.list.forEach(function(item, i){
      var gm = item.gm;
      var chips = '';
      gm.g.forEach(function(x){
        chips += '<span class="chip'+(selG.indexOf(x)>=0?' hit':'')+'">'+x+'</span>';
      });
      gm.s.forEach(function(x){
        chips += '<span class="chip s'+(selS.indexOf(x)>=0?' hit':'')+'">'+x+'</span>';
      });
      html +=
        '<article class="card">' +
          '<span class="rank">'+(i===0?'TOP 1':('NO.'+(i+1)))+'</span>' +
          '<div class="c-top">' +
            '<div class="c-emoji">'+gm.e+'</div>' +
            '<div><h3 class="c-name">'+gm.n+'</h3>' +
            '<p class="c-meta">WeGame 评分 <b>'+gm.r.toFixed(1)+'</b> · '+gm.p+'人在玩</p></div>' +
          '</div>' +
          '<div class="chips">'+chips+'</div>' +
          '<p class="c-desc">'+gm.d+'</p>' +
          '<div class="reason">'+reasonText(gm, item.gs, item.ss)+'</div>' +
          '<div class="c-foot"><span>匹配度</span><span class="score">'+pctOf(item)+'%</span></div>' +
        '</article>';
    });
    html += '</div>';
    stage.innerHTML = html;

    var more = $('moreBtn');
    if(more) more.addEventListener('click', function(){ run(true); });
  }

  /* ============ 思考过程 ============ */
  var STEPS = [
    '> 读取你的标签组合…',
    '> 载入 '+GAMES.length+' 款游戏特征向量…',
    '> 计算类型 / 风格匹配权重…',

    '> 生成个性化推荐理由…'
  ];
  function renderThinking(){
    stage.innerHTML =
      '<div class="thinking">' +
        '<div class="bot">🤖</div>' +
        '<div class="line">AI 正在分析你的游戏偏好</div>' +
        '<div class="bar"><i></i></div>' +
        '<div class="steps" id="step">'+STEPS[0]+'</div>' +
      '</div>';
    var el = $('step'), i = 0;
    var timer = setInterval(function(){
      i++;
      if(i < STEPS.length && el) el.textContent = STEPS[i];
      else clearInterval(timer);
    }, 400);
    return timer;
  }

  /* ============ 主流程 ============ */
  var busy = false;
  function run(isMore){
    if(busy) return;
    busy = true;
    aiBtn.disabled = true;
    aiBtn.innerHTML = '<span class="spark">⏳</span>分析中…';
    stage.scrollIntoView({behavior:'smooth', block:'nearest'});
    var t = renderThinking();
    setTimeout(function(){
      clearInterval(t);
      renderCards(recommend());
      aiBtn.disabled = false;
      aiBtn.innerHTML = '<span class="spark">✨</span>AI 推荐';
      busy = false;
      bubbleSay(isMore ? '换了一批，这次有中意的吗？' : '挑好啦！看看这三款合不合口味 🎮');
    }, 2000);
  }

  /* ============ 蛋蛋君 ============ */
  var bubble = $('bubble'), egg = $('egg'), sayTimer = null;
  function bubbleSay(text){
    bubble.textContent = text;
    egg.classList.add('show');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function(){ egg.classList.remove('show'); }, 3800);
  }
  $('eggBtn').addEventListener('click', function(){
    bubbleSay('选好了吗？让我帮你找款好游戏！');
    if(selG.length + selS.length === 0){
      shuffle(GENRES); shuffle(STYLES);
      selG = [GENRES[0].id]; selS = [STYLES[0].id];
      syncTags();
      updateSelInfo();
    }
    run(false);
  });

  function syncTags(){
    var all = document.querySelectorAll('.tag');
    for(var i=0;i<all.length;i++){
      var el = all[i], v = el.dataset.v;
      var arr = el.dataset.k==='g' ? selG : selS;
      var on = arr.indexOf(v) >= 0;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  function clearAll(){
    selG = []; selS = []; lastPicks = [];
    syncTags(); updateSelInfo();
  }
  function lucky(){
    clearAll();
    selG = pickRandom(GENRES, 2).map(function(x){ return x.id; });
    selS = pickRandom(STYLES, 1).map(function(x){ return x.id; });
    syncTags(); updateSelInfo();
    run(false);
  }

  /* ============ 初始化 ============ */
  buildTags();
  aiBtn.addEventListener('click', function(){ run(false); });
  $('clearBtn').addEventListener('click', clearAll);
  $('luckyBtn').addEventListener('click', lucky);
  updateSelInfo();
})();
</script>
</body>
</html>
