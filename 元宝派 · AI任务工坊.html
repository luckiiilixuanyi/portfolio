<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="LujSb7W7MxIX8kgpNQDEdh">
<head data-page-node-id="rbxY8yBxBRBOQz4uB7b2r8">
<meta charset="UTF-8" data-page-node-id="MX9t4SGtpmGyR1oFdMcd3l">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="qYZiFIAxVEHVTsIyfjH9gJ">
<title>元宝派 · AI任务工坊</title>
<style>
:root{
  --orange:#FF6B00;
  --orange-l:#FF9142;
  --orange-bg:#FFF3EA;
  --navy:#0B1A33;
  --navy-2:#17304F;
  --ink:#0F1B2D;
  --muted:#6B7A90;
  --line:#E8EDF4;
  --soft:#F7F9FC;
  --green:#12B76A;
  --blue:#2E7CF6;
  --radius:18px;
  --shadow:0 10px 30px rgba(11,26,51,.08);
  --shadow-lg:0 18px 48px rgba(11,26,51,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:#fff;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 420px at 88% -8%, rgba(255,107,0,.10), transparent 62%),
    radial-gradient(560px 380px at 2% 6%, rgba(46,124,246,.07), transparent 60%),
    radial-gradient(700px 500px at 50% 108%, rgba(11,26,51,.05), transparent 65%);
}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:saturate(180%) blur(14px);
  background:rgba(255,255,255,.86);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1080px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px;
}
.logo{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--orange) 0%,var(--orange-l) 55%,#FFB37A 100%);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 6px 16px rgba(255,107,0,.32);
}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto}
.brand b{font-size:16px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.pai-chip{
  display:flex;align-items:center;gap:6px;flex:none;
  border:1px solid var(--line);background:#fff;color:var(--navy);
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.2s;
}
.pai-chip:hover{border-color:var(--orange);color:var(--orange);background:var(--orange-bg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(18,183,106,.18)}

/* ---------- Layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 120px}
.hero{text-align:center;margin:14px 0 26px}
.hero h1{
  margin:0 0 10px;font-size:clamp(26px,5.2vw,40px);line-height:1.25;letter-spacing:-.5px;
  color:var(--navy);font-weight:800;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--orange),var(--orange-l));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:0 auto;max-width:620px;color:var(--muted);font-size:14.5px}

/* ---------- Panel ---------- */
.panel{
  background:#fff;border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);padding:22px;
}
.panel-label{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--navy);margin:0 0 12px;
}
.panel-label i{
  width:4px;height:15px;border-radius:2px;background:var(--orange);display:inline-block;
}
.panel-label small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}

.tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.tag{
  display:inline-flex;align-items:center;gap:7px;
  border:1.5px solid var(--line);background:#fff;color:var(--navy);
  border-radius:14px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;
  transition:all .18s ease;user-select:none;
}
.tag:hover{transform:translateY(-2px);border-color:rgba(255,107,0,.45);box-shadow:0 6px 16px rgba(255,107,0,.12)}
.tag.on{
  background:linear-gradient(135deg,var(--orange),var(--orange-l));
  color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(255,107,0,.30);
}
.tag .em{font-size:16px;line-height:1}

.input-box{
  position:relative;border:1.5px solid var(--line);border-radius:16px;background:var(--soft);
  padding:14px 16px;transition:.2s;
}
.input-box:focus-within{border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(255,107,0,.10)}
.input-box textarea{
  width:100%;border:0;outline:0;background:transparent;resize:none;
  font-family:inherit;font-size:15.5px;color:var(--ink);line-height:1.6;min-height:52px;
}
.input-box textarea::placeholder{color:#A3B0C2}
.input-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:10px}
.counter{font-size:12px;color:var(--muted)}
.counter.warn{color:var(--orange)}

.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ex{
  border:1px dashed var(--line);background:#fff;color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:.18s;
}
.ex:hover{color:var(--orange);border-color:var(--orange);background:var(--orange-bg)}

.btn-main{
  width:100%;margin-top:18px;border:0;cursor:pointer;
  padding:16px 20px;border-radius:16px;
  background:linear-gradient(100deg,var(--orange) 0%,#FF8A2B 55%,var(--orange-l) 100%);
  background-size:180% 100%;
  color:#fff;font-size:16.5px;font-weight:800;letter-spacing:.4px;font-family:inherit;
  box-shadow:0 12px 28px rgba(255,107,0,.32);
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:.22s;
}
.btn-main:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 16px 34px rgba(255,107,0,.40)}
.btn-main:active{transform:translateY(0) scale(.99)}
.btn-main[disabled]{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.btn-main .spark{font-size:18px}
.btn-main.busy .spark{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Thinking ---------- */
.think{
  margin-top:22px;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:var(--navy);color:#fff;box-shadow:var(--shadow-lg);
  display:none;
}
.think.show{display:block;animation:rise .35s ease both}
.think-head{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid rgba(255,255,255,.10);
  background:linear-gradient(100deg,rgba(255,107,0,.16),transparent);
}
.think-head b{font-size:14px}
.think-head .live{
  margin-left:auto;font-size:11.5px;color:#FFB37A;display:flex;align-items:center;gap:6px;
}
.think-head .live i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.think-bar{height:3px;background:rgba(255,255,255,.10)}
.think-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FFC08A);transition:width .3s ease}
.think-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:2px}
.step{
  display:flex;align-items:flex-start;gap:10px;padding:7px 0;
  font-size:14px;color:rgba(255,255,255,.55);opacity:0;transform:translateY(6px);
}
.step.in{animation:stepIn .3s ease forwards}
@keyframes stepIn{to{opacity:1;transform:none}}
.step.done{color:#fff}
.step .ic{width:18px;text-align:center;flex:none;font-size:14px}
.step .txt{flex:1}
.step .txt em{font-style:normal;color:#FFB37A;font-weight:600}
.step .ok{color:var(--green);font-size:12px;opacity:0}
.step.done .ok{opacity:1}
.cursor{display:inline-block;width:7px;height:15px;background:var(--orange);vertical-align:-2px;animation:blink .8s steps(2) infinite}

/* ---------- Results ---------- */
.sec-head{
  display:flex;align-items:center;gap:10px;margin:34px 0 16px;flex-wrap:wrap;
}
.sec-head h2{margin:0;font-size:19px;color:var(--navy);font-weight:800}
.sec-head .meta{font-size:12.5px;color:var(--muted)}
.sec-head .spacer{flex:1}
.link-btn{
  border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:10px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.18s;
}
.link-btn:hover{color:var(--orange);border-color:var(--orange)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  animation:rise .4s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-top{
  padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start;
  border-bottom:1px solid var(--line);position:relative;
}
.card-top::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--orange));
}
.ico{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff;letter-spacing:.5px;
  background:var(--accent,var(--orange));box-shadow:0 6px 14px rgba(11,26,51,.16);
}
.ico.pdf{background:#E23C3C}
.ico.doc{background:#2E7CF6}
.ico.excel{background:#12B76A}
.ico.html{background:#7A5AF8}
.ico.ppt{background:#FF6B00}
.file-meta{min-width:0;flex:1}
.file-name{
  font-size:14.5px;font-weight:700;color:var(--navy);word-break:break-all;line-height:1.4;
}
.file-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.badge{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--orange-bg);color:var(--orange);margin-left:6px;vertical-align:1px;
}

.preview{padding:14px 16px;background:var(--soft);flex:1}
.prev-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;margin-bottom:9px}

/* ppt preview */
.slide-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slide{
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;position:relative;
}
.slide-no{position:absolute;right:8px;top:7px;font-size:9.5px;color:#B9C4D4;font-weight:700}
.slide b{display:block;font-size:11.5px;color:var(--navy);line-height:1.35;font-weight:700;padding-right:14px}
.slide i{display:block;height:4px;border-radius:2px;background:#EDF1F7;margin-top:6px}
.slide i:nth-child(3){width:72%}
.slide i:nth-child(4){width:52%}

/* word preview */
.doc-page{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px}
.doc-h{height:9px;width:46%;border-radius:3px;background:var(--navy);margin-bottom:9px}
.doc-line{height:5px;border-radius:2px;background:#EDF1F7;margin-bottom:6px}
.doc-line.s{width:78%}
.doc-line.xs{width:56%}
.doc-sec{display:flex;align-items:center;gap:6px;margin:10px 0 5px}
.doc-sec em{font-style:normal;font-size:11px;font-weight:700;color:var(--orange)}
.doc-sec u{flex:1;height:1px;background:var(--line)}

/* excel preview */
.sheet{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
table.mini{width:100%;border-collapse:collapse;font-size:11px}
table.mini th{
  background:#EEF3FA;color:var(--navy);font-weight:700;text-align:left;padding:7px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
table.mini th.corner{width:22px;background:#E4EBF5;color:#9AA8BC;text-align:center}
table.mini td{padding:6.5px 8px;border-bottom:1px solid #F1F4F9;color:#33445C;white-space:nowrap}
table.mini tr:last-child td{border-bottom:0}
table.mini td.rowh{background:#EEF3FA;color:#8B9BB2;text-align:center;font-weight:700;width:22px}
.up{color:#D93025;font-weight:700}
.down{color:#12B76A;font-weight:700}

/* pdf preview */
.pdf-page{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px}
.pdf-kicker{font-size:10px;color:var(--orange);font-weight:800;letter-spacing:1px}
.pdf-title{font-size:13px;font-weight:800;color:var(--navy);margin:3px 0 9px}
.pdf-item{display:flex;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:11.5px}
.pdf-item b{color:var(--orange);flex:none;font-size:11px}
.pdf-item span{color:#45566E;line-height:1.5}

/* html preview */
.browser{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.browser-bar{display:flex;align-items:center;gap:5px;padding:7px 9px;background:#F1F4F9;border-bottom:1px solid var(--line)}
.browser-bar i{width:7px;height:7px;border-radius:50%;background:#D8E0EC}
.browser-bar i:nth-child(1){background:#FF6058}
.browser-bar i:nth-child(2){background:#FFBD2E}
.browser-bar i:nth-child(3){background:#28C840}
.browser-bar u{
  flex:1;height:15px;border-radius:8px;background:#fff;border:1px solid var(--line);
  margin-left:5px;text-decoration:none;font-size:9px;color:#9AA8BC;display:grid;place-items:center;
}
.html-body{padding:11px}
.html-body .nav{height:7px;background:var(--navy);border-radius:3px;width:34%;margin-bottom:10px}
.html-body .blk{height:38px;border-radius:6px;background:linear-gradient(100deg,rgba(255,107,0,.9),rgba(255,145,66,.6));margin-bottom:8px}
.html-body .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.html-body .cards i{height:26px;border-radius:5px;background:#EDF1F7;display:block}
.html-body .cards i:nth-child(2){background:#F6E9DE}
.code{
  background:var(--navy);border-radius:8px;padding:9px 10px;color:#9FD0FF;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.7;
  white-space:pre;overflow-x:auto;margin-top:4px;
}
.code .t{color:#FF9D5C}
.code .a{color:#7EE0A8}

.kpis{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.kpi{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;
}
.kpi b{display:block;font-size:12.5px;color:var(--navy);font-weight:800}
.kpi span{font-size:10px;color:var(--muted)}

.card-foot{padding:12px 16px;display:flex;gap:9px;border-top:1px solid var(--line)}
.btn{
  flex:none;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;border:1px solid var(--line);background:#fff;color:var(--navy);transition:.18s;
}
.btn:hover{border-color:var(--navy)}
.btn.primary{
  flex:1;background:var(--orange);border-color:var(--orange);color:#fff;
  box-shadow:0 6px 16px rgba(255,107,0,.26);
}
.btn.primary:hover{background:#E86000;border-color:#E86000}
.btn.done{background:var(--green);border-color:var(--green);color:#fff;box-shadow:none}

/* empty */
.empty{
  border:1.5px dashed var(--line);border-radius:20px;padding:46px 22px;text-align:center;color:var(--muted);
}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.55}
.empty b{display:block;color:var(--navy);font-size:15px;margin-bottom:5px}

/* ---------- 元宝派 FAB ---------- */
.fab{
  position:fixed;right:22px;bottom:22px;z-index:60;
  width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;font-size:25px;display:grid;place-items:center;
  box-shadow:0 12px 30px rgba(11,26,51,.34);transition:.22s;
}
.fab:hover{transform:translateY(-3px) scale(1.04)}
.fab::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid rgba(255,107,0,.5);animation:pulse 2s infinite;
}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.fab .tip{
  position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);
  background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;
  padding:7px 11px;border-radius:10px;box-shadow:0 8px 20px rgba(11,26,51,.24);
}
.fab .tip::after{
  content:"";position:absolute;left:100%;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-left-color:var(--navy);
}

.pai{
  position:fixed;right:22px;bottom:92px;z-index:61;width:340px;max-width:calc(100vw - 32px);
  background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
  overflow:hidden;display:none;
}
.pai.show{display:block;animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.pai-head{
  padding:14px 16px;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;
  display:flex;align-items:center;gap:10px;
}
.pai-ava{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(135deg,var(--orange),var(--orange-l));flex:none;
}
.pai-head b{font-size:14.5px;display:block;line-height:1.3}
.pai-head span{font-size:11px;color:#9FB2CC}
.pai-close{
  margin-left:auto;background:rgba(255,255,255,.10);border:0;color:#fff;cursor:pointer;
  width:26px;height:26px;border-radius:8px;font-size:15px;line-height:1;
}
.pai-body{padding:14px 16px;display:flex;flex-direction:column;gap:11px;max-height:46vh;overflow:auto}
.bubble{
  background:var(--soft);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:10px 13px;font-size:13.5px;color:#2A3A52;line-height:1.65;
  opacity:0;transform:translateY(8px);
}
.bubble.in{animation:stepIn .34s ease forwards}
.bubble b{color:var(--orange)}
.bubble .bot{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:700}
.agent-card{
  border:1px solid rgba(255,107,0,.28);background:var(--orange-bg);border-radius:14px;padding:11px 13px;
  display:flex;align-items:center;gap:11px;
}
.agent-card .av{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.agent-card b{font-size:13.5px;color:var(--navy);display:block}
.agent-card span{font-size:11px;color:var(--muted)}
.devices{display:flex;gap:7px;margin-top:9px}
.dev{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;background:#fff;
}
.dev em{font-style:normal;font-size:16px;display:block}
.dev span{font-size:10px;color:var(--muted)}
.pai-foot{padding:11px 16px 15px;display:flex;gap:8px;border-top:1px solid var(--line)}
.pai-foot .btn{flex:1;text-align:center;font-size:12.5px;padding:9px 8px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:80;
  background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:0 14px 34px rgba(11,26,51,.32);opacity:0;pointer-events:none;transition:.26s;
  max-width:calc(100vw - 40px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;color:#A3B0C2;font-size:12px;margin-top:40px;line-height:1.8}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  .topbar-in{padding:10px 14px}
  .brand b{font-size:15px}
  .pai-chip span{display:none}
  .wrap{padding:18px 14px 110px}
  .hero{margin:8px 0 20px}
  .panel{padding:16px;border-radius:20px}
  .tags{gap:8px}
  .tag{padding:9px 12px;font-size:13px;border-radius:12px}
  .grid{grid-template-columns:1fr;gap:13px}
  .btn-main{font-size:15.5px;padding:15px}
  .fab{right:14px;bottom:16px;width:52px;height:52px;font-size:22px}
  .fab .tip{display:none}
  .pai{right:14px;left:14px;bottom:78px;width:auto;max-width:none}
  .pai-body{max-height:52vh}

  /* ============ 文本解析 ============ */
  var TAIL_RE=/(幻灯片|演示文稿|PPTX|PPT|WORD|Word|word|DOCX|DOC|文档|报告|XLSX|XLS|EXCEL表|EXCEL|Excel表|Excel|excel表|excel|数据表|统计表|清单表|台账表|表格|数据|PDF|Pdf|pdf|攻略|手册|白皮书|HTML|Html|html|专题页|网页|页面|网站|文件|的|吧|呢|啊|一下|谢谢)$/;
  function cleanCore(text){
    var s=(text||'').trim();
    // 去句首引导词
    var HEAD_RE=/^(帮我|麻烦|我想要|我想|我要|需要|请|来一份|来个|整一个|整个|搞一个|搞个|弄一个|弄个|做一份|做份|做一个|做个|写一份|写份|写个|生成一份|生成一个|生成|做|写|搞|弄|来|出个|出一个|准备|一份|一个)/;
    var hg=0;
    while(HEAD_RE.test(s) && hg++<6){ s=s.replace(HEAD_RE,''); }
    // 循环去句尾的类型词 / 语气词
    var guard=0;
    while(TAIL_RE.test(s) && guard++<10){ s=s.replace(TAIL_RE,''); }
    s=s.replace(/[，。,.！!？?；;、\s·\-—]+$/g,'').trim();
    if(s.length>22) s=s.slice(0,22);
    return s;
  }

  function detectTheme(text){
    var t=(text||'').toLowerCase(), best=null, bestScore=0;
    THEMES.forEach(function(th){
      var score=0;
      th.kw.forEach(function(k){ if(t.indexOf(k.toLowerCase())>-1) score+=k.length; });
      if(score>bestScore){ bestScore=score; best=th; }
    });
    return best || THEMES[THEMES.length-1];
  }

  function detectTypes(text){
    var t=(text||'').toLowerCase(), hit=[];
    function has(arr){ return arr.some(function(k){ return t.indexOf(k)>-1; }); }
    if(has(['ppt','幻灯片','汇报','演示','演讲','deck','路演'])) hit.push('ppt');
    if(has(['word','文档','报告','总结','方案','合同','纪要','doc'])) hit.push('doc');
    if(has(['excel','表格','xlsx','台账','清单','数据表','统计'])) hit.push('excel');
    if(has(['pdf','攻略','手册','白皮书','电子书'])) hit.push('pdf');
    if(has(['html','网页','页面','落地页','官网','专题页','网站'])) hit.push('html');
    return hit;
  }

  function runSteps(list, onDone){
    stepsEl.innerHTML='';
    thinkEl.classList.add('show');

    var i=0, timer=null;
    var nodes=[];

    function next(){
      if(i>=list.length){
        thinkEl.querySelector('.live').innerHTML='<i style="background:#12B76A"></i>已完成';
        timer=setTimeout(onDone, 320);
        return;
      }
      var el=document.createElement('div');
      el.className='step';
      el.innerHTML='<span class="ic">⏳</span><span class="txt">'+list[i]+'</span><span class="ok">✓</span>';
      stepsEl.appendChild(el);
      nodes.push(el);
      requestAnimationFrame(function(){ el.classList.add('in'); });
      barEl.style.width=Math.round(((i+1)/list.length)*100)+'%';
      thinkEl.scrollIntoView({behavior:'smooth', block:'nearest'});

      setTimeout(function(){
        el.querySelector('.ic').textContent='✅';
        el.classList.add('done');
        i++;
        next();
      }, 300 + Math.random()*180);
    }
    next();
  }

  /* ============ 主流程 ============ */
  function generate(){
    if(genBtn.disabled) return;
    var text=needEl.value.trim();
    if(!text){
      toast('先告诉我你要做什么，比如「做一份Q3市场分析PPT」');
      needEl.focus();
      return;
    }

    var types=Object.keys(selected);
    var auto=false;
    if(!types.length){
      types=detectTypes(text);
      auto=true;
      if(!types.length){ types=['ppt']; }
    }

    var theme=detectTheme(text);
    var core=cleanCore(text)||theme.label;
    lastPayload={types:types, theme:theme, core:core, text:text, auto:auto};

    genBtn.disabled=true;
    genBtn.classList.add('busy');
    genBtn.querySelector('.spark').textContent='⚙️';
    genBtn.childNodes[1].nodeValue=' 元宝 Agent 正在干活…';
    resultEl.innerHTML='';
    secHead.style.display='none';

    runSteps(stepsFor(types, theme), function(){
      renderResults(lastPayload);
      genBtn.disabled=false;
      genBtn.classList.remove('busy');
      genBtn.querySelector('.spark').textContent='⚡';
      genBtn.childNodes[1].nodeValue=' 元宝 Agent 一键生成';
    });
  }

    // 事件绑定

      dls[i].addEventListener('click', function(){
        var key=this.getAttribute('data-dl');
        var t=TYPE_MAP[key];

        var f=buildFile(key, p.theme, p.core, title);
        var blob=new Blob([f.text],{type:f.mime});

        var a=document.createElement('a');
        a.href=url; a.download=f.name; document.body.appendChild(a); a.click();
        setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },400);
        var btn=this;
        btn.classList.add('done'); btn.textContent='✓ 已下载';
        setTimeout(function(){ btn.classList.remove('done'); btn.textContent='⬇ 下载文件'; },2200);
        toast('✅ '+f.name+' 已开始下载');

    for(var j=0;j<cps.length;j++){

  function copyText(str){
    var ok=function(){ toast('📋 已复制，可直接粘贴到元宝派继续编辑'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(str).then(ok, fallback);
    } else fallback();
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=str; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('复制失败，请手动选择内容'); }
      document.body.removeChild(ta);
    }
  }

      }
      var m=msgs.shift();
      var el=document.createElement('div');
      el.className='bubble';
      el.innerHTML='<span class="bot">'+m[0]+'</span>'+m[1];
      paiBody.appendChild(el);
      requestAnimationFrame(function(){ el.classList.add('in'); });
      paiBody.scrollTop=paiBody.scrollHeight;
      paiTimer=setTimeout(push, 480);
    }
    push();
  }
  function closePai(){ paiEl.classList.remove('show'); clearTimeout(paiTimer); }

  $('fab').addEventListener('click', function(){ paiEl.classList.contains('show')?closePai():openPai(); });
  $('paiClose').addEventListener('click', closePai);
  $('paiChip').addEventListener('click', function(){
    if(!paiEl.classList.contains('show')) openPai();
    paiEl.scrollIntoView({behavior:'smooth',block:'center'});
  });
  document.addEventListener('click', function(e){
    if(paiEl.classList.contains('show') && !paiEl.contains(e.target) && !$('fab').contains(e.target) && !$('paiChip').contains(e.target)){
      closePai();
    }
  });
  $('atBtn').addEventListener('click', function(){
    toast('已在派内 @小龙虾：收到，正在帮你改文件 ✍️');
  });
  $('inviteBtn').addEventListener('click', function(){
    toast('邀请链接已生成，复制后可直接发给同事 🔗');
  });

  /* ============ 其它 ============ */
  var toastTimer=null;
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },2600);
  }

  genBtn.addEventListener('click', generate);
  $('reGen').addEventListener('click', function(){ if(lastPayload) generate(); });
  $('clearBtn').addEventListener('click', function(){
    resultEl.innerHTML='<div class="empty"><div class="big">🗂️</div><b>还没有生成任何文件</b>选好类型、描述需求，让元宝 Agent 帮你干活</div>';
    secHead.style.display='none';
    thinkEl.classList.remove('show');
  });

  // 初始空态
  resultEl.innerHTML='<div class="empty"><div class="big">🗂️</div><b>还没有生成任何文件</b>选好类型、描述需求，让元宝 Agent 帮你干活</div>';
})();
</script>
</body>
</html>
