<title>光影魔方 · 腾讯视频 AI 观影助手</title>
<style>
  :root{
    --navy:#0B1A33;
    --navy-2:#081426;
    --navy-3:#12294d;
    --gold:#D4AF37;
    --gold-light:#F0D680;
    --gold-soft:rgba(212,175,55,.14);
    --white:#FFFFFF;
    --text:#E8EEFB;
    --muted:#8FA3C4;
    --line:rgba(255,255,255,.10);
    --radius:18px;
    --shadow:0 18px 48px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:var(--navy-2);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 背景氛围 ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(212,175,55,.16), transparent 60%),
      radial-gradient(760px 520px at 92% 4%, rgba(64,120,220,.20), transparent 62%),
      radial-gradient(1000px 700px at 50% 110%, rgba(212,175,55,.08), transparent 60%),
      linear-gradient(180deg,#0B1A33 0%,#0A1730 45%,#081426 100%);
  }
  .bg::after{
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
  }

  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 18px 140px;}

  /* ---------- Header ---------- */
  header{text-align:center;margin-bottom:26px;}
  .brand{display:inline-flex;align-items:center;gap:11px;padding:7px 16px 7px 9px;border-radius:999px;
    background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.30);backdrop-filter:blur(8px);}
  .brand .cube{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0B1A33;font-weight:800;
    box-shadow:0 4px 14px rgba(212,175,55,.4);}
  .brand span{font-size:14px;letter-spacing:.12em;color:var(--gold);font-weight:600;}
  h1{margin:18px 0 8px;font-size:clamp(26px,6.2vw,40px);line-height:1.25;letter-spacing:.5px;font-weight:800;}
  h1 em{font-style:normal;background:linear-gradient(120deg,var(--gold),#FFF0C0 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{margin:0;color:var(--muted);font-size:clamp(13px,3.4vw,15px);}
  .badge-ai{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:5px 13px;border-radius:999px;
    font-size:12px;color:#BFD3F5;background:rgba(64,120,220,.14);border:1px solid rgba(120,170,255,.28);}
  .dot{width:6px;height:6px;border-radius:50%;background:#5EE08A;box-shadow:0 0 0 0 rgba(94,224,138,.7);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,224,138,.6)}70%{box-shadow:0 0 0 9px rgba(94,224,138,0)}100%{box-shadow:0 0 0 0 rgba(94,224,138,0)}}

  /* ---------- 面板 ---------- */
  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
    border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px;
    box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  .panel-title{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:.04em;}
  .panel-title .idx{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;
    background:var(--gold-soft);color:var(--gold);border:1px solid rgba(212,175,55,.35);font-weight:800;}
  .panel-hint{margin:0 0 16px;font-size:12.5px;color:var(--muted);padding-left:31px;}

  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    appearance:none;cursor:pointer;font:inherit;font-size:14px;
    padding:9px 17px;border-radius:999px;color:#C9D9F5;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.15);
    transition:transform .16s ease,background .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .chip .ico{font-size:14px;filter:grayscale(.35);transition:filter .2s;}
  .chip:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.5);color:#fff;}
  .chip.on{
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#0B1A33;font-weight:700;border-color:transparent;
    box-shadow:0 8px 22px rgba(212,175,55,.32);
  }
  .chip.on .ico{filter:none;}
  .chip.on::after{content:"✓";font-size:12px;font-weight:900;}

  /* ---------- 主按钮 ---------- */
  .cta-zone{text-align:center;margin:26px 0 6px;}
  .cta{
    position:relative;overflow:hidden;cursor:pointer;font:inherit;
    padding:16px 46px;border-radius:999px;border:0;font-size:17px;font-weight:800;letter-spacing:.08em;
    color:#0B1A33;background:linear-gradient(120deg,#D4AF37,#F6E29B 45%,#D4AF37);
    box-shadow:0 14px 40px rgba(212,175,55,.38),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .18s ease,box-shadow .22s ease,opacity .2s;
    display:inline-flex;align-items:center;gap:10px;
  }
  .cta:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 20px 52px rgba(212,175,55,.5);}
  .cta:active:not(:disabled){transform:translateY(0);}
  .cta:disabled{opacity:.6;cursor:not-allowed;}
  .cta .spark{font-size:18px;}
  .cta::before{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-22deg);animation:sheen 3.4s ease-in-out infinite;}
  @keyframes sheen{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .cta-note{margin:12px 0 0;font-size:12px;color:var(--muted);}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(11,26,51,.28);border-top-color:#0B1A33;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- AI 思考区 ---------- */
  .stage{min-height:80px;margin-top:22px;}
  .thinking{
    border:1px solid rgba(120,170,255,.24);border-radius:var(--radius);padding:20px;
    background:linear-gradient(180deg,rgba(64,120,220,.13),rgba(255,255,255,.02));
    animation:rise .35s ease both;
  }
  .th-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:#DCE8FF;}
  .vv{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;
    background:linear-gradient(135deg,#4F8BFF,#7FB2FF);color:#04122b;font-weight:900;
    box-shadow:0 0 18px rgba(79,139,255,.5);animation:breathe 1.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
  .th-lines{margin:14px 0 0;padding:0;list-style:none;font-size:13.5px;color:#A9C0E6;}
  .th-lines li{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px;opacity:0;animation:fadeIn .32s ease forwards;}
  .th-lines li .mk{color:var(--gold);font-weight:800;}
  @keyframes fadeIn{to{opacity:1}}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:15px;}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#4F8BFF,var(--gold));transition:width .2s linear;}

  /* ---------- 结果 ---------- */
  .result-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:16px;}
  .result-head h2{margin:0;font-size:18px;font-weight:800;}
  .result-head h2 span{color:var(--gold);}
  .echo{display:flex;flex-wrap:wrap;gap:8px;}
  .echo i{font-style:normal;font-size:11.5px;padding:4px 11px;border-radius:999px;
    background:var(--gold-soft);border:1px solid rgba(212,175,55,.35);color:var(--gold-light);}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}

  .card{
    position:relative;border-radius:var(--radius);padding:20px 18px 18px;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.028));
    border:1px solid rgba(212,175,55,.20);
    box-shadow:0 12px 34px rgba(0,0,0,.32);
    animation:rise .45s cubic-bezier(.2,.8,.25,1) both;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
  }
  .card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.55);box-shadow:0 20px 46px rgba(0,0,0,.45);}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75;}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .rank{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    font-size:12px;font-weight:900;color:#0B1A33;background:linear-gradient(135deg,var(--gold),var(--gold-light));}
  .c-type{font-size:11.5px;color:var(--gold);letter-spacing:.14em;font-weight:700;text-transform:uppercase;}
  .c-title{margin:8px 0 2px;font-size:19px;font-weight:800;line-height:1.35;color:#fff;letter-spacing:.01em;}
  .c-meta{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .c-tags span{font-size:11px;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);color:#B9CCEB;}
  .c-line{font-size:13.5px;color:#D3E0F6;margin:0 0 14px;font-style:italic;line-height:1.7;}
  .c-reason{font-size:12.8px;line-height:1.72;color:#B6C8E8;padding:11px 13px;border-radius:11px;
    background:rgba(212,175,55,.075);border-left:2px solid var(--gold);}
  .c-reason b{color:var(--gold-light);font-weight:700;}
  .score{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
  .score .track{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;}
  .score .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#FFF1C9);width:0;transition:width .9s cubic-bezier(.2,.8,.25,1);}

  /* ---------- 计划 ---------- */
  .plan-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .plan-total{font-size:13px;color:var(--muted);}
  .plan-total b{color:var(--gold-light);font-size:20px;font-weight:800;}
  .timeline{display:flex;gap:5px;margin:14px 0 20px;height:26px;}
  .tl{position:relative;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#0B1A33;
    overflow:hidden;animation:grow .6s cubic-bezier(.2,.8,.25,1) both;}
  .tl.t0{background:linear-gradient(135deg,#D4AF37,#F0D680);}
  .tl.t1{background:linear-gradient(135deg,#4F8BFF,#8FB8FF);}
  .tl.t2{background:linear-gradient(135deg,#7B5BE0,#B79BFF);}
  @keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
  .steps{list-style:none;margin:0;padding:0;}
  .steps li{display:flex;gap:13px;padding:13px 0;border-top:1px dashed rgba(255,255,255,.11);animation:fadeIn .4s ease both;}
  .steps li:first-child{border-top:0;}
  .s-no{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;
    color:var(--gold);background:var(--gold-soft);border:1px solid rgba(212,175,55,.4);}
  .s-body{flex:1;min-width:0;}
  .s-t{font-size:14.5px;font-weight:700;color:#fff;}
  .s-d{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .s-m{flex:0 0 auto;font-size:12px;color:var(--gold-light);font-weight:700;background:var(--gold-soft);
    border:1px solid rgba(212,175,55,.3);padding:3px 10px;border-radius:999px;height:fit-content;}
  .plan-foot{margin-top:18px;padding:13px 15px;border-radius:12px;font-size:12.8px;color:#C6D7F2;
    background:rgba(79,139,255,.10);border:1px solid rgba(120,170,255,.22);display:flex;gap:10px;}
  .plan-foot .em{font-size:16px;}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .ghost{cursor:pointer;font:inherit;font-size:14px;padding:11px 24px;border-radius:999px;
    background:transparent;color:#C9D9F5;border:1px solid rgba(255,255,255,.2);transition:all .2s;}
  .ghost:hover{border-color:var(--gold);color:var(--gold-light);background:var(--gold-soft);}

  footer{text-align:center;margin-top:34px;font-size:11.5px;color:#5E7093;line-height:1.9;}

  /* ---------- 空状态 ---------- */
  .empty{text-align:center;padding:44px 20px;border:1px dashed rgba(255,255,255,.14);border-radius:var(--radius);
    color:var(--muted);font-size:13.5px;animation:fadeIn .4s ease both;}
  .empty .big{font-size:38px;display:block;margin-bottom:12px;opacity:.75;}

  /* ---------- AI 角色彩蛋 ---------- */
  .bot{position:fixed;right:20px;bottom:22px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .bubble{
    max-width:min(290px,78vw);padding:14px 16px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.7;
    color:#08203f;background:linear-gradient(135deg,#F6E29B,#D4AF37);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    animation:pop .28s cubic-bezier(.2,1.3,.4,1) both;
  }
  .bubble::after{content:"";}
  .bubble .who{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.62;margin-bottom:5px;}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
  .bot-btn{
    width:60px;height:60px;border-radius:50%;cursor:pointer;border:1px solid rgba(212,175,55,.55);font-size:27px;
    background:linear-gradient(135deg,#12294d,#0B1A33);color:#fff;
    box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 6px rgba(212,175,55,.10);
    display:grid;place-items:center;transition:transform .2s ease,box-shadow .2s ease;animation:float 3.4s ease-in-out infinite;
  }
  .bot-btn:hover{transform:scale(1.08);box-shadow:0 16px 38px rgba(0,0,0,.55),0 0 0 10px rgba(212,175,55,.14);}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .bot-tip{font-size:10.5px;color:var(--muted);background:rgba(8,20,38,.7);padding:3px 9px;border-radius:999px;
    border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(4px);}

  /* ---------- Toast ---------- */
  .toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-24px);z-index:99;opacity:0;
    padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;color:#08203f;
    background:linear-gradient(135deg,#F6E29B,#D4AF37);box-shadow:0 10px 28px rgba(0,0,0,.4);
    transition:opacity .28s ease,transform .28s ease;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media(max-width:600px){
    .wrap{padding:20px 14px 150px;}
    .panel{padding:18px 15px;border-radius:18px;}
    .panel-hint{padding-left:0;}
    .cta{width:100%;justify-content:center;padding:15px 20px;}
    .chip{font-size:13.5px;padding:8px 15px;}
    .bot{right:14px;bottom:16px;}
    .bot-btn{width:54px;height:54px;font-size:24px;}
    .c-title{font-size:17px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
</style>
</head>

  /* ============ 推荐算法 ============ */
  function durationFit(mins, target){
    const d = Math.abs(Math.log(mins / target));
    return Math.exp(-(d*d)/0.9); // 0~1，越接近目标时长越高
  }
  function scoreItem(item, moods, target){
    let moodScore = 0;
    moods.forEach((m, i)=>{
      const pos = item.moods.indexOf(m);
      if(pos === 0) moodScore += 2;
      else if(pos > 0) moodScore += 1.1;
      else moodScore -= 0.4;
    });
    if(moods.length === 0) moodScore = 0;
    const fit = durationFit(item.mins, target);
    return moodScore * 1.15 + fit * 2.2 + Math.random() * 0.25;
  }
  function recommend(){
    const moods = [...state.moods];

    const target = t ? t.mins : 60;

    const scored = LIBRARY
      .filter(it => moods.length === 0 || it.moods.some(m=>moods.includes(m)))
      .map(it => ({ ...it, _s: scoreItem(it, moods, target) }))
      .sort((a,b)=> b._s - a._s);

    let pool = scored.slice(0, 3);
    if(pool.length < 3){ // 兜底：用全局高分补齐
      const extra = LIBRARY
        .filter(it => !pool.some(p=>p.title===it.title))
        .map(it => ({ ...it, _s: scoreItem(it, moods, target) }))
        .sort((a,b)=> b._s - a._s);
      pool = pool.concat(extra).slice(0,3);
    }
    return { cards: pool, target, moods, timeLabel: t ? t.label : '1小时' };
  }

  /* ============ 生成观影计划 ============ */
  function buildPlan(cards, target){
    const ordered = cards.slice().sort((a,b)=> target <= 60 ? a.mins - b.mins : b.mins - a.mins);
    let remain = target;
    const steps = [];

    ordered.forEach(m=>{
      if(remain <= 0) return;
      if(remain >= m.mins){
        steps.push({ kind:'full', title:'完整观看《' + m.title + '》', mins:m.mins,
          desc:'沉浸式主线时间，建议关灯、戴耳机、手机调静音' });
        remain -= m.mins;
      } else if(remain >= m.mins * 0.8){
        steps.push({ kind:'main', title:'推进《' + m.title + '》主线 ' + remain + ' 分钟', mins:remain,
          desc:'片尾留到明晚，悬念过夜更有味道' });
        remain = 0;

        steps.push({ kind:'peek', title:'速览《' + m.title + '》开场 ' + remain + ' 分钟', mins:remain,
          desc:'先用名场面建立情绪，完整版已加入「稍后再看」' });
        remain = 0;
      }
    });

    if(remain >= 8){
      steps.push({ kind:'extra', title:'VV AI 生成《' + ordered[0].title + '》名场面解说', mins:remain,

    }

        desc:'时间太短啦，先用预告片解解馋，完整版已存入片单' });
      remain = 0;
    }
    const total = steps.reduce((s,x)=>s+x.mins, 0);
    return { steps, total, remain };
  }

  /* ============ 渲染结果 ============ */
  function renderResult(r){
    const moodLabels = r.moods.map(id => (MOODS.find(m=>m.id===id)||{}).label).filter(Boolean);
    const plan = buildPlan(r.cards, r.target);
    const maxScore = Math.max.apply(null, r.cards.map(c=>c._s));

    const echoHtml = moodLabels.concat([r.timeLabel])
      .map(x=>'<i>' + esc(x) + '</i>').join('');

    const cardsHtml = r.cards.map((m,i)=>{
      const pct = Math.max(62, Math.min(99, Math.round((m._s / maxScore) * 100)));
      return '' +
      '<article class="card" style="animation-delay:' + (i*0.11) + 's">' +
        '<span class="rank">' + (i+1) + '</span>' +
        '<div class="c-type">' + esc(m.types[0]) + ' · AI 推荐</div>' +
        '<h3 class="c-title">' + esc(m.title) + '</h3>' +
        '<div class="c-meta">' + esc(m.meta) + '</div>' +
        '<div class="c-tags">' + m.types.map(t=>'<span>' + esc(t) + '</span>').join('') +
          '<span>' + m.mins + ' 分钟</span></div>' +
        '<p class="c-line">「' + esc(m.line) + '」</p>' +
        '<div class="c-reason"><b>推荐理由 · </b>根据你选择的「' +
          esc(moodLabels.join('、') || '综合偏好') + '」偏好与「' + esc(r.timeLabel) +
          '」时长，我们推荐这部影片。' + esc(m.reason) + '</div>' +
        '<div class="score"><span>匹配度</span><span class="track"><i class="fill" data-w="' + pct + '"></i></span><span>' + pct + '%</span></div>' +
      '</article>';
    }).join('');

    const tl = plan.steps.map((s,i)=>
      '<div class="tl t' + (i%3) + '" style="flex:' + Math.max(s.mins,1) + ';animation-delay:' + (i*0.12) + 's">' + s.mins + '′</div>'
    ).join('');

    const stepsHtml = plan.steps.map((s,i)=>
      '<li style="animation-delay:' + (i*0.1) + 's">' +
        '<span class="s-no">' + (i+1) + '</span>' +
        '<span class="s-body"><span class="s-t">' + esc(s.title) + '</span><span class="s-d">' + esc(s.desc) + '</span></span>' +
        '<span class="s-m">' + s.mins + ' min</span>' +
      '</li>'
    ).join('');

    stage.innerHTML =
      '<section class="panel" style="animation:rise .4s ease both">' +
        '<div class="result-head">' +
          '<h2>VV AI 为你找到 <span>' + r.cards.length + '</span> 部影片</h2>' +
          '<div class="echo">' + echoHtml + '</div>' +
        '</div>' +
        '<div class="grid">' + cardsHtml + '</div>' +
      '</section>' +
      '<section class="panel" style="animation:rise .4s ease both .18s">' +
        '<div class="plan-head">' +
          '<h2 class="panel-title" style="margin:0"><span class="idx">✓</span>今晚观影计划</h2>' +
          '<div class="plan-total">预计总时长 <b>' + plan.total + '</b> 分钟</div>' +
        '</div>' +
        '<p class="panel-hint" style="padding-left:31px">按推荐顺序执行，时间到就停 —— 明天还有下一集等你</p>' +
        '<div class="timeline">' + tl + '</div>' +
        '<ul class="steps">' + stepsHtml + '</ul>' +
        '<div class="plan-foot"><span class="em">🍿</span><span>片尾仪式：在弹幕或备忘录里留一句今晚的感受（0 分钟，但很重要）。' +
          '未排完的部分已自动存入「稍后再看」，明天接着看。</span></div>' +
        '<div class="actions">' +
          '<button class="ghost" id="againBtn">↻ 换一批推荐</button>' +
          '<button class="ghost" id="resetBtn">重新选择条件</button>' +
        '</div>' +
      '</section>';

    requestAnimationFrame(()=>{
      document.querySelectorAll('.score .fill').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
    });
    $('againBtn').addEventListener('click', ()=> run(true));
    $('resetBtn').addEventListener('click', reset);
  }

  /* ============ 主流程 ============ */
  function run(isReroll){
    if(state.loading) return;
    if(!isReroll && state.moods.size === 0 && !state.time){
      showToast('先选一个心情或时长吧 🙂');
      moodChips.firstChild && moodChips.firstChild.classList.add('on');
      return;
    }
    clearTimers();
    state.loading = true;
    ctaBtn.disabled = true;
    ctaText.textContent = 'VV AI 匹配中';
    ctaSpark.outerHTML = '<span class="spinner" id="ctaSpark"></span>';
    renderThinking();

    timers.push(setTimeout(()=>{
      const r = recommend();
      state.results = r;
      renderResult(r);
      state.loading = false;
      ctaBtn.disabled = false;
      ctaText.textContent = 'AI 找片';
      const sp = $('ctaSpark'); if(sp) sp.outerHTML = '<span class="spark" id="ctaSpark">✦</span>';
      showToast(isReroll ? '已为你换一批新片单 ✦' : '片单已生成，今晚有着落了 ✦');
    }, 2050));
  }

  function reset(){
    clearTimers();
    state.moods.clear(); state.time = null; state.loading = false; state.results = null;
    document.querySelectorAll('.chip').forEach(c=>{ c.classList.remove('on'); c.setAttribute('aria-pressed','false'); });
    ctaBtn.disabled = false; ctaText.textContent = 'AI 找片';
    stage.innerHTML =
      '<div class="empty" id="emptyState"><span class="big">🎬</span>' +
      '选择心情与时长，让 VV AI 帮你把今晚安排明白。<br />要不，先随便挑一个心情试试？</div>';
    syncNote();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  ctaBtn.addEventListener('click', ()=>run(false));

  /* ============ AI 角色彩蛋 ============ */
  const botBtn = $('botBtn'), bubbleHost = $('bubbleHost');
  let botTimer = null;
  botBtn.addEventListener('click', ()=>{
    if(bubbleHost.firstChild){ bubbleHost.innerHTML=''; clearTimeout(botTimer); return; }
    const line = BOT_LINES[state.lineIdx % BOT_LINES.length];
    state.lineIdx++;
    bubbleHost.innerHTML =
      '<div class="bubble"><span class="who">' + esc(line.who) + '</span>' + esc(line.text) + '</div>';
    clearTimeout(botTimer);
    botTimer = setTimeout(()=>{ bubbleHost.innerHTML=''; }, 5200);
  });

  syncNote();
})();
</script>
</body>
</html>
