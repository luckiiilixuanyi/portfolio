<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Px0HOK0RqZ20CkEZKEncnE">
<head data-page-node-id="u72wZCrRVDyAvyoNP1qJac">
<meta charset="UTF-8" data-page-node-id="B0P4gmqn4EVHxa0m4GleMS" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="BuLgkuOGS6wP9jqVC7LWjJ" />
<title>腾讯营销智能体（MAGIC Agent）模拟器</title>
<style>
  :root{
    --navy:#0B1A33;
    --navy-2:#12294D;
    --navy-3:#0E2140;
    --gold:#D4AF37;
    --gold-soft:#E9C96B;
    --gold-dim:rgba(212,175,55,.16);
    --white:#FFFFFF;
    --text:#E9EFF8;
    --muted:#8FA2BF;
    --muted-2:#6F83A3;
    --line:rgba(255,255,255,.09);
    --line-gold:rgba(212,175,55,.28);
    --radius:16px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--navy);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* 背景光晕与网格 */
  .bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-fx::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(900px 520px at 12% -8%, rgba(212,175,55,.16), transparent 62%),
      radial-gradient(760px 460px at 92% 4%, rgba(41,98,255,.18), transparent 60%),
      radial-gradient(1000px 700px at 50% 108%, rgba(212,175,55,.08), transparent 65%);
  }
  .bg-fx::after{
    content:"";position:absolute;inset:0;opacity:.35;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(1200px 620px at 50% 0%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(1200px 620px at 50% 0%, #000 0%, transparent 78%);
  }

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px 96px}

  /* ---------- 顶部品牌栏 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 6px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(145deg,var(--gold) 0%,#A8822A 100%);
    display:grid;place-items:center;color:#0B1A33;font-weight:900;font-size:15px;letter-spacing:.5px;
    box-shadow:0 6px 18px rgba(212,175,55,.28);
  }
  .brand-txt{min-width:0}
  .brand-txt b{display:block;font-size:14.5px;letter-spacing:.3px;font-weight:700}
  .brand-txt span{display:block;font-size:11.5px;color:var(--muted-2);letter-spacing:1.4px;text-transform:uppercase}
  .badge{
    flex:none;font-size:11px;color:var(--gold-soft);border:1px solid var(--line-gold);
    background:var(--gold-dim);padding:5px 11px;border-radius:999px;white-space:nowrap;letter-spacing:.4px;
  }

  /* ---------- Hero ---------- */
  .hero{padding:34px 0 8px;text-align:center}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--gold-soft);
    border:1px solid var(--line-gold);background:rgba(212,175,55,.08);padding:6px 14px;border-radius:999px;
  }
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block;
    box-shadow:0 0 0 0 rgba(212,175,55,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}70%{box-shadow:0 0 0 9px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}
  h1{
    margin:18px 0 12px;font-size:clamp(26px,5.2vw,44px);line-height:1.22;font-weight:800;letter-spacing:-.4px;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--gold-soft),#FFF3CE 45%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{max-width:640px;margin:0 auto;color:var(--muted);font-size:clamp(13.5px,2.6vw,15.5px)}

  /* ---------- 输入卡 ---------- */
  .panel{
    margin-top:30px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
    border:1px solid var(--line);border-radius:20px;padding:20px;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.85);
    backdrop-filter:blur(6px);
  }
  .field-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .field-label span{font-size:12.5px;color:var(--muted);letter-spacing:.6px}
  .goal-input{
    width:100%;min-height:96px;resize:vertical;
    background:rgba(4,12,26,.62);border:1px solid var(--line);border-radius:14px;
    color:var(--text);font-size:15px;line-height:1.7;padding:14px 15px;outline:none;
    font-family:inherit;transition:border-color .2s,box-shadow .2s;
  }
  .goal-input:focus{border-color:var(--line-gold);box-shadow:0 0 0 3px rgba(212,175,55,.10)}
  .goal-input:disabled{opacity:.55;cursor:not-allowed}
  .goal-input::placeholder{color:#5E7191}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
  .chip{
    font-size:12px;color:var(--muted);border:1px solid var(--line);background:rgba(255,255,255,.03);
    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.18s;font-family:inherit;
  }
  .chip:hover{color:var(--gold-soft);border-color:var(--line-gold);background:rgba(212,175,55,.08)}
  .chip:active{transform:scale(.97)}

  .action-row{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  .btn-primary{
    flex:1 1 260px;min-width:220px;
    background:linear-gradient(135deg,var(--gold) 0%,#B8912C 100%);
    color:#0B1A33;border:0;border-radius:13px;padding:15px 22px;
    font-size:15.5px;font-weight:800;letter-spacing:.5px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 12px 28px -10px rgba(212,175,55,.55);transition:transform .16s,box-shadow .2s,filter .2s;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 34px -10px rgba(212,175,55,.65)}
  .btn-primary:active{transform:translateY(0)}
  .btn-primary[disabled]{filter:grayscale(.55) brightness(.8);cursor:not-allowed;transform:none;box-shadow:none}
  .btn-primary .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(11,26,51,.28);border-top-color:#0B1A33;animation:spin .7s linear infinite;display:none}
  .btn-primary.running .spin{display:inline-block}
  .btn-primary.running .ico{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .btn-ghost{
    background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:13px;
    padding:14px 18px;font-size:14px;cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap;
  }
  .btn-ghost:hover{color:var(--gold-soft);border-color:var(--line-gold)}
  .btn-ghost[disabled]{opacity:.4;cursor:not-allowed}

  .speed{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:11px;padding:3px;background:rgba(4,12,26,.5)}
  .speed button{
    background:transparent;border:0;color:var(--muted-2);font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.16s;
  }
  .speed button.on{background:rgba(212,175,55,.16);color:var(--gold-soft);font-weight:700}

  /* ---------- 流水线 ---------- */
  .flow{
    display:flex;align-items:flex-start;gap:0;margin:34px 0 6px;padding:16px 10px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);border-radius:18px;overflow-x:auto;
  }
  .flow-node{flex:1 1 0;min-width:96px;text-align:center;position:relative;padding:0 4px}
  .flow-node .dot{
    width:34px;height:34px;margin:0 auto 8px;border-radius:50%;
    border:1.5px solid var(--line);background:rgba(6,16,34,.8);color:var(--muted-2);
    display:grid;place-items:center;font-size:12px;font-weight:800;transition:.35s;
  }
  .flow-node .nm{font-size:12px;font-weight:700;color:var(--muted-2);transition:.3s;white-space:nowrap}
  .flow-node .rl{font-size:10.5px;color:#5C6F8E;margin-top:2px;white-space:nowrap}
  .flow-node .bar{position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1.5px;background:var(--line);transition:background .5s}
  .flow-node:last-child .bar{display:none}
  .flow-node.done .dot,.flow-node.active .dot{border-color:var(--gold);color:#0B1A33;background:linear-gradient(145deg,var(--gold),#B8912C)}
  .flow-node.done .nm,.flow-node.active .nm{color:var(--gold-soft)}
  .flow-node.active .dot{box-shadow:0 0 0 0 rgba(212,175,55,.5);animation:pulse 1.8s infinite}
  .flow-node.done .bar,.flow-node.active .bar{background:linear-gradient(90deg,var(--gold),rgba(212,175,55,.25))}

  /* ---------- Agent 卡片 ---------- */
  .agents{margin-top:22px;display:flex;flex-direction:column;gap:16px}
  .agent{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:18px;
    opacity:.34;filter:saturate(.3);transform:translateY(10px);
    transition:opacity .5s,transform .5s,filter .5s,border-color .4s,box-shadow .4s;
  }
  .agent.live{opacity:1;filter:none;transform:none;border-color:var(--line-gold);box-shadow:0 26px 60px -34px rgba(0,0,0,.9),0 0 0 1px rgba(212,175,55,.06)}
  .agent.finished{border-color:rgba(212,175,55,.16)}
  .agent::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--gold),rgba(212,175,55,.05));
    opacity:0;transition:opacity .45s;
  }
  .agent.live::before,.agent.finished::before{opacity:1}

  .a-head{display:flex;align-items:center;gap:13px;padding:17px 18px 15px}
  .a-icon{
    width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
    background:rgba(212,175,55,.10);border:1px solid var(--line-gold);color:var(--gold-soft);
  }
  .a-icon svg{width:21px;height:21px;display:block}
  .a-title{flex:1;min-width:0}
  .a-title .n{font-size:15.5px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .a-title .n i{font-style:normal;font-size:11px;color:var(--gold);border:1px solid var(--line-gold);background:var(--gold-dim);padding:2px 7px;border-radius:5px;letter-spacing:.6px;vertical-align:middle}
  .a-title .d{font-size:12.5px;color:var(--muted-2);margin-top:1px}
  .status{
    flex:none;font-size:11.5px;padding:5px 11px;border-radius:999px;letter-spacing:.4px;
    border:1px solid var(--line);color:var(--muted-2);background:rgba(255,255,255,.03);transition:.3s;white-space:nowrap;
  }
  .status.think{color:#8FD0FF;border-color:rgba(80,170,255,.32);background:rgba(60,150,255,.10)}
  .status.done{color:#6FE0A8;border-color:rgba(80,220,160,.3);background:rgba(60,210,150,.10)}
  .status .blink{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

  /* 思考日志 */
  .logs{padding:0 18px;display:none;flex-direction:column;gap:7px}
  .agent.live .logs,.agent.finished .logs{display:flex}
  .log{
    display:flex;gap:9px;align-items:flex-start;font-family:var(--mono);font-size:12.5px;line-height:1.65;
    color:#9DB4D4;opacity:0;transform:translateX(-6px);animation:logIn .35s forwards;
  }
  @keyframes logIn{to{opacity:1;transform:none}}
  .log .mk{color:var(--gold);flex:none;line-height:1.7}
  .log.ok .mk{color:#6FE0A8}
  .log .tx{min-width:0;word-break:break-word}
  .log .tm{margin-left:auto;flex:none;color:#4F6382;font-size:11px;padding-top:2px}
  .caret{display:inline-block;width:7px;height:14px;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:blink .8s steps(2) infinite}

  /* 输出区 */
  .out{padding:16px 18px 18px}
  .out-sep{height:1px;background:var(--line);margin:14px 0 16px;opacity:0;transition:opacity .4s}
  .agent.finished .out-sep{opacity:1}
  .headline{
    font-size:14.5px;line-height:1.85;color:#DCE7F6;
    background:rgba(212,175,55,.055);border-left:2px solid var(--gold);
    padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:14px;
  }
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .tag{
    font-size:12px;color:var(--gold-soft);background:rgba(212,175,55,.09);
    border:1px solid rgba(212,175,55,.22);padding:5px 11px;border-radius:7px;
    opacity:0;transform:translateY(6px);animation:pop .4s forwards;
  }
  @keyframes pop{to{opacity:1;transform:none}}

  .group{margin-bottom:14px}
  .g-title{
    font-size:11.5px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;
    margin-bottom:9px;opacity:0;animation:pop .4s forwards;display:flex;align-items:center;gap:8px;
  }
  .g-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.3),transparent)}
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{
    display:flex;gap:12px;align-items:baseline;
    background:rgba(4,12,26,.42);border:1px solid rgba(255,255,255,.055);border-radius:11px;padding:11px 13px;
    opacity:0;transform:translateY(7px);animation:pop .42s forwards;
  }
  .row .k{
    flex:none;font-size:11.5px;font-weight:800;color:#0B1A33;background:linear-gradient(135deg,var(--gold),#C29A2E);
    padding:3px 9px;border-radius:6px;letter-spacing:.3px;white-space:nowrap;
  }
  .row .v{font-size:13.5px;color:#D3E0F1;line-height:1.7;min-width:0;word-break:break-word}
  .row .v b{color:var(--gold-soft);font-weight:700}
  .row .v .dim{color:var(--muted-2)}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-top:4px}
  .metric{
    background:linear-gradient(160deg,rgba(212,175,55,.10),rgba(255,255,255,.02));
    border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:12px 13px;
    opacity:0;transform:scale(.96);animation:pop .4s forwards;
  }
  .metric .mv{font-size:20px;font-weight:800;color:var(--gold-soft);letter-spacing:-.3px;line-height:1.2;font-variant-numeric:tabular-nums}
  .metric .mv small{font-size:12px;font-weight:700;margin-left:2px}
  .metric .ml{font-size:11.5px;color:var(--muted-2);margin-top:3px}

  .a-foot{
    display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:11px 18px;border-top:1px solid var(--line);background:rgba(4,12,26,.28);
    font-family:var(--mono);font-size:11px;color:#5E7191;letter-spacing:.3px;
  }
  .agent.finished .a-foot{display:flex}
  .a-foot .ok{color:#6FE0A8}

  /* ---------- 总结看板 ---------- */
  .summary{
    margin-top:26px;border-radius:20px;overflow:hidden;
    border:1px solid rgba(212,175,55,.34);
    background:linear-gradient(165deg,rgba(212,175,55,.10),rgba(10,24,46,.9) 42%);
    box-shadow:0 30px 70px -34px rgba(0,0,0,.95);
    display:none;
  }
  .summary.on{display:block;animation:riseIn .6s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .s-head{padding:22px 22px 18px;border-bottom:1px solid rgba(212,175,55,.18);position:relative}
  .s-head .tt{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:.2px}
  .s-head .tt i{
    font-style:normal;font-size:10.5px;color:#0B1A33;background:linear-gradient(135deg,var(--gold),#C29A2E);
    padding:3px 8px;border-radius:5px;letter-spacing:.8px;font-weight:800;
  }
  .s-head .goal{
    margin-top:11px;font-size:13.5px;color:#C6D5EB;line-height:1.75;
    background:rgba(4,12,26,.42);border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:11px 13px;
  }
  .s-head .goal b{color:var(--gold-soft)}
  .s-body{padding:20px 22px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .s-card{
    background:rgba(4,12,26,.46);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 16px;
  }
  .s-card .ct{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--gold-soft);margin-bottom:11px;letter-spacing:.4px}
  .s-card .ct .no{
    width:20px;height:20px;border-radius:6px;background:rgba(212,175,55,.16);border:1px solid rgba(212,175,55,.3);
    display:grid;place-items:center;font-size:11px;color:var(--gold);flex:none;
  }
  .s-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .s-card li{font-size:13px;color:#CCD9EC;line-height:1.7;padding-left:13px;position:relative}
  .s-card li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.75}
  .s-card li em{font-style:normal;color:#8FA2BF}
  .s-card.wide{grid-column:1/-1}
  .s-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .kpi{background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.16);border-radius:11px;padding:12px;text-align:center}
  .kpi .v{font-size:22px;font-weight:800;color:var(--gold-soft);line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:12px}
  .kpi .l{font-size:11.5px;color:var(--muted-2);margin-top:4px}
  .s-foot{
    padding:14px 22px;border-top:1px solid rgba(255,255,255,.07);background:rgba(4,12,26,.34);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:11.5px;color:#5E7191;font-family:var(--mono);letter-spacing:.3px;
  }
  .s-foot .acts{display:flex;gap:9px;flex-wrap:wrap}
  .mini{
    background:transparent;border:1px solid var(--line-gold);color:var(--gold-soft);
    padding:8px 14px;border-radius:10px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.18s;
  }
  .mini:hover{background:rgba(212,175,55,.12)}

  /* ---------- 页脚 ---------- */
  footer{padding:30px 0 0;text-align:center;color:#4E6180;font-size:11.5px;line-height:1.9}

  /* ---------- 移动端 ---------- */
  @media (max-width:640px){
    .wrap{padding:0 14px 72px}
    .topbar{padding:16px 0 4px}
    .badge{font-size:10px;padding:4px 9px}
    .hero{padding:24px 0 4px}
    .panel{padding:15px;border-radius:17px;margin-top:22px}
    .goal-input{min-height:88px;font-size:14.5px}
    .btn-primary{flex:1 1 100%;padding:14px 18px;font-size:15px}
    .btn-ghost,.speed{flex:1 1 auto}
    .speed{justify-content:center}
    .speed button{flex:1}
    .flow{padding:14px 6px 8px;gap:0}
    .flow-node{min-width:78px}
    .flow-node .dot{width:30px;height:30px;font-size:11px}
    .flow-node .nm{font-size:11px}
    .flow-node .rl{font-size:9.5px}
    .flow-node .bar{top:15px;left:calc(50% + 19px);right:calc(-50% + 19px)}
    .a-head{padding:15px 14px 13px;gap:11px}
    .a-icon{width:38px;height:38px;border-radius:11px}
    .a-icon svg{width:19px;height:19px}
    .a-title .n{font-size:14.5px}
    .a-title .d{font-size:11.5px}
    .status{font-size:11px;padding:4px 9px}
    .logs,.out{padding-left:14px;padding-right:14px}
    .log{font-size:11.8px}
    .log .tm{display:none}
    .headline{font-size:13.5px}
    .row{flex-direction:column;gap:6px}
    .row .k{align-self:flex-start}
    .s-head,.s-body,.s-foot{padding-left:15px;padding-right:15px}
    .s-body{grid-template-columns:1fr}
  }

    var html = text; // 允许内嵌标签，按字符切分但跳过标签整体
    var idx = 0, buf = '', out = '';
    var plain = [];
    // 把字符串拆成「标签块」和「单字」
    var tokens = [];
    while(idx < html.length){
      if(html[idx] === '<'){
        var end = html.indexOf('>', idx);
        if(end === -1){ tokens.push(html.slice(idx)); break; }
        tokens.push(html.slice(idx, end + 1)); idx = end + 1;
      } else { tokens.push(html[idx]); idx++; }
    }
    node.innerHTML = '';
    var caret = el('span','caret');
    node.appendChild(caret);

    return (function step(){
      if(clock.skip){
        node.innerHTML = html;
        return Promise.resolve();
      }
      var chunk = Math.max(1, Math.round(2 * clock.speed));
      for(var i=0;i<chunk && tokens.length;i++) out += tokens.shift();
      node.innerHTML = out;
      node.appendChild(caret);
      if(clock.skip){ node.innerHTML = html; return Promise.resolve(); }
      if(!tokens.length){ caret.remove(); return Promise.resolve(); }
      return raw(clock.skip ? 0 : (speed || 24) / clock.speed).then(step);
    })();
  }

  function appendLog(logsEl, text, ok){
    var line = el('div','log' + (ok ? ' ok' : ''));
    line.innerHTML = '<span class="mk">' + (ok ? '✓' : '›') + '</span><span class="tx"></span>' +
                     '<span class="tm">' + (Math.random()*0.9 + 0.2).toFixed(1) + 's</span>';
    logsEl.appendChild(line);
    var tx = line.querySelector('.tx');
    return typeInto(tx, esc(text), 14).then(function(){
      return sleep(clock.skip ? 0 : 120);
    });
  }

  /* ================= 输出渲染 ================= */
  function renderOutput(box, out){
    var seq = Promise.resolve();
    var delay = 0;

    var hl = el('div','headline');
    box.appendChild(hl);
    seq = seq.then(function(){ return typeInto(hl, out.headline, 16); })
             .then(function(){ return sleep(clock.skip ? 0 : 150); });

    if(out.tags && out.tags.length){
      seq = seq.then(function(){
        if(clock.skip){ return; }
        var tags = el('div','tags');
        box.appendChild(tags);
        out.tags.forEach(function(t, i){
          var tg = el('span','tag', esc(t));
          tg.style.animationDelay = (i * 55) + 'ms';
          tags.appendChild(tg);
        });
        return sleep(clock.skip ? 0 : 240);
      });
    }

    (out.groups || []).forEach(function(g){
      seq = seq.then(function(){
        if(clock.skip) return;
        var wrapEl = el('div','group');
        var t = el('div','g-title', esc(g.title));
        wrapEl.appendChild(t);
        var rows = el('div','rows');
        wrapEl.appendChild(rows);
        box.appendChild(wrapEl);
        g.rows.forEach(function(r, i){
          var row = el('div','row');
          row.innerHTML = '<span class="k">' + esc(r.k) + '</span><span class="v">' + r.v + '</span>';
          row.style.animationDelay = (80 + i * 90) + 'ms';
          rows.appendChild(row);
        });
        return sleep(clock.skip ? 0 : 260 + g.rows.length * 90);
      });
    });

    if(out.metrics && out.metrics.length){
      seq = seq.then(function(){
        if(clock.skip) return;
        var m = el('div','metrics');
        box.appendChild(m);
        out.metrics.forEach(function(x, i){
          var card = el('div','metric');
          card.innerHTML = '<div class="mv" data-to="' + x.v + '"><span class="num">0</span><small>' + x.u + '</small></div>' +
                           '<div class="ml">' + esc(x.l) + '</div>';
          card.style.animationDelay = (i * 70) + 'ms';
          m.appendChild(card);
        });
        Array.prototype.forEach.call(m.querySelectorAll('.mv'), function(node){
          countUp(node.querySelector('.num'), node.dataset.to);
        });
        return sleep(clock.skip ? 0 : 420);
      });
    }
    return seq.catch(function(e){ console.error(e); });
  }

  function countUp(node, target){
    var str = String(target);
    if(!/^\d+(\.\d+)?$/.test(str) || clock.skip){ node.textContent = str; return; }
    var to = parseFloat(str);
    var dur = 700 / clock.speed, t0 = null;
    function frame(ts){
      if(clock.skip){ node.textContent = target; return; }
      if(!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      var v = to * e;
      node.textContent = (to >= 100 ? Math.round(v) : (Math.round(v * 10) / 10)) + suffix;
      if(p < 1) requestAnimationFrame(frame);
      else node.textContent = target;
    }
    requestAnimationFrame(frame);
  }

  /* ================= 主流程 ================= */
  var state = { running:false };

  function resetAll(){
    AGENTS.forEach(function(a){ flowNode(a.key, null); });
    buildCards();
    summaryEl.className = 'summary';
    summaryEl.innerHTML = '';
  }

  function run(){
    if(state.running) return;
    state.running = true;
    clock.skip = false;
    clock.token++;

    startBtn.classList.add('running');
    startBtn.disabled = true;
    skipBtn.disabled = false;
    startBtn.querySelector('.lbl').textContent = '智能体协同执行中…';
    inputEl.disabled = true;

    resetAll();
    var ctx = parseGoal(inputEl.value);
    var token = clock.token;
    var t0 = Date.now();

    var chain = Promise.resolve();
    AGENTS.forEach(function(a, i){
      chain = chain.then(function(){
        if(token !== clock.token) return;
        var card = document.getElementById('card-' + a.key);
        card.classList.add('live');
        flowNode(a.key, 'active');
        setStatus(a.key, '思考中', 'think');
        scrollTo(card);
        return sleep(clock.skip ? 0 : 260);
      })
      .then(function(){
        if(token !== clock.token) return;
        var card = document.getElementById('card-' + a.key);
        var logs = card.querySelector('[data-role=logs]');
        var lines = a.think(ctx);
        var p = Promise.resolve();
        lines.forEach(function(t, idx){
          p = p.then(function(){
            if(token !== clock.token) return;
            return appendLog(logs, t, idx === lines.length - 1);
          });
        });
        return p;
      })
      .then(function(){
        if(token !== clock.token) return;
        var card = document.getElementById('card-' + a.key);
        var box = card.querySelector('[data-role=out]');
        var out = a.build(ctx);
        ctx['out_' + a.key] = out;
        return renderOutput(box, out);
      })
      .then(function(){
        if(token !== clock.token) return;
        var card = document.getElementById('card-' + a.key);
        var secs = ((Date.now() - t0) / 1000 / (i + 1) * (1 + Math.random() * 0.4)).toFixed(1);
        card.classList.remove('live');
        card.classList.add('finished');
        flowNode(a.key, 'done');
        setStatus(a.key, '已完成', 'done');
        card.querySelector('[data-role=foot]').innerHTML =
          '<span class="ok">✓ 执行完毕</span> · 用时 ' + secs + 's · 输出 ' +
          ((out_count(ctx, a.key))) + ' 项';
        return sleep(clock.skip ? 0 : 320);
      });
    });

    chain.then(function(){
      if(token !== clock.token) return;
      return renderSummary(ctx, ((Date.now() - t0) / 1000).toFixed(1));
    }).then(function(){
      state.running = false;
      startBtn.classList.remove('running');
      startBtn.disabled = false;
      skipBtn.disabled = true;
      inputEl.disabled = false;
      startBtn.querySelector('.lbl').textContent = '重新运行 MAGIC Agent 团队';
    }).catch(function(err){
      console.error(err);
      state.running = false;
      startBtn.classList.remove('running');
      startBtn.disabled = false;
      skipBtn.disabled = true;
      inputEl.disabled = false;
    });
  }

  function out_count(ctx, key){
    var o = ctx['out_' + key];
    if(!o) return 0;
    var n = (o.tags ? o.tags.length : 0);
    (o.groups || []).forEach(function(g){ n += g.rows.length; });
    return n;
  }

  function renderSummary(c, secs){
    var g = function(k){ return c['out_' + k]; };
    var mine = g('mine'), arch = g('arch'), gen = g('gen'), act = g('act'), chk = g('chk');

    summaryEl.innerHTML =
      '<div class="s-head">' +
        '<div class="tt">MAGIC 营销方案总览 <i>COMPLETE</i></div>' +
        '<div class="goal"><b>任务简报：</b>' + esc(c.raw) +
          '<br/><b>核心目标：</b>' + esc(c.goal) + ' · <b>目标人群：</b>' + esc(c.age + ' / ' + c.city) +
          ' · <b>品类：</b>' + esc(c.catName) + '</div>' +
      '</div>' +
      '<div class="s-body">' +
        card('1','目标人群（Mine Agent）', [
          '<em>核心画像：</em>' + esc(c.age + '、' + c.city + '，' + c.cat.tags.slice(0,3).join('、')),
          '<em>人群包：</em>A 类核心人群 / B 类场景触发人群 / C 类竞品摇摆人群',
          '<em>可触达规模：</em>' + mine.metrics[0].v + mine.metrics[0].u + '，高价值占比 ' + mine.metrics[1].v + '%',
          '<em>黄金触点：</em>晚间 19:00-22:30、周末 10:00-12:00'
        ]) +
        card('2','活动节奏（Architect Agent）', [
          '<em>全周期：</em>' + arch.metrics[0].v + ' 天，三段式节奏推进',
          arch.groups[0].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[0],
          arch.groups[0].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[1],
          arch.groups[0].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[2]
        ]) +
        card('3','内容物料（Generate Agent）', [
          '<em>物料总数：</em>' + gen.metrics[0].v + ' 件，含 ' + gen.metrics[1].v + ' 套 A/B 版本',
          gen.groups[1].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[0],
          gen.groups[1].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[1],
          gen.groups[1].rows.map(function(r){ return '<em>' + r.k + '：</em>' + r.v.replace(/<\/?b>/g,''); })[2]
        ]) +
        card('4','触达渠道（Interact Agent）', [
          '<em>触达矩阵：</em>' + act.groups[0].rows.map(function(r){ return r.k; }).join(' + '),
          '<em>预计触达：</em>' + act.metrics[0].v + act.metrics[0].u + '，到达率 ' + act.metrics[2].v + '%',
          '<em>互动机制：</em>千人千面话术 + 对话式 AI 导购 7×24 应答',
          '<em>频控策略：</em>单用户每周 ≤4 次，22:30-08:00 免打扰'
        ]) +
        card('5','预期效果（Check Agent）', [
          '<em>预计触达：</em>' + chk.metrics[0].v + chk.metrics[0].u,
          '<em>预估转化：</em>' + chk.metrics[1].v + '%',
          '<em>预估 ROI：</em>' + chk.metrics[2].v + ' 倍',
          '<em>核心建议：</em>爆发期前完成素材赛马，预算向 A/B 类人群倾斜'
        ], true) +
      '</div>' +
      '<div class="s-foot">' +
        '<span>五智能体协同完成 · 总耗时 ' + secs + 's · 生成 ' +
          (AGENTS.reduce(function(s,a){ return s + out_count(c, a.key); }, 0)) + ' 项输出</span>' +
        '<span class="acts">' +
          '<button class="mini" id="copyBtn">复制方案摘要</button>' +
          '<button class="mini" id="againBtn">再跑一次</button>' +
        '</span>' +
      '</div>';

    summaryEl.classList.add('on');

    // KPI 条
    var kpiWrap = el('div','s-card wide');
    kpiWrap.innerHTML = '<div class="ct"><span class="no">★</span>核心指标看板</div><div class="s-kpi">' +
      kpi(chk.metrics[0].v, chk.metrics[0].u + '人', '预计触达') +
      kpi(chk.metrics[1].v, '%', '预估转化率') +
      kpi(chk.metrics[2].v, '×', '预估 ROI') +
      kpi(mine.metrics[1].v, '%', '高价值人群占比') +
      kpi(arch.metrics[0].v, '天', '活动周期') +
      kpi(gen.metrics[0].v, '件', '生成物料') +
      '</div>';
    summaryEl.querySelector('.s-body').appendChild(kpiWrap);

    scrollTo(summaryEl);

    var again = document.getElementById('againBtn');
    var copy = document.getElementById('copyBtn');
    if(again) again.onclick = function(){ window.scrollTo({top:0,behavior:'smooth'}); setTimeout(run, 420); };
    if(copy) copy.onclick = function(){
      var txt = summaryText(c);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ flash(copy,'已复制 ✓'); },
          function(){ fallbackCopy(txt, copy); });
      } else fallbackCopy(txt, copy);
    };
    return sleep(clock.skip ? 0 : 200);
  }

  function card(no, title, items, wide){
    return '<div class="s-card' + (wide ? ' wide' : '') + '">' +
      '<div class="ct"><span class="no">' + no + '</span>' + title + '</div>' +
      '<ul>' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul></div>';
  }
  function kpi(v, u, l){
    return '<div class="kpi"><div class="v">' + v + '<small>' + u + '</small></div><div class="l">' + l + '</div></div>';
  }
  function flash(btn, txt){
    var old = btn.textContent; btn.textContent = txt;
    setTimeout(function(){ btn.textContent = old; }, 1600);
  }
  function fallbackCopy(txt, btn){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); flash(btn,'已复制 ✓'); }
    catch(e){ flash(btn,'复制失败'); }
    document.body.removeChild(ta);
  }
  function summaryText(c){
    var g = function(k){ return c['out_' + k]; };
    return '【MAGIC Agent 营销方案】\n任务：' + c.raw + '\n目标：' + c.goal + '\n人群：' + c.age + ' / ' + c.city +
      '\n品类：' + c.catName + '\n\n' + AGENTS.map(function(a){
        var o = g(a.key);
        return '▸ ' + a.name + '（' + a.role + '）\n' + o.headline.replace(/<[^>]+>/g,'') +
          '\n' + (o.groups||[]).map(function(gr){
            return '  · ' + gr.title + '\n' + gr.rows.map(function(r){
              return '    [' + r.k + '] ' + r.v.replace(/<[^>]+>/g,'');
            }).join('\n');
          }).join('\n');
      }).join('\n\n');
  }

  /* ================= 事件绑定 ================= */
  buildFlow();
  buildCards();

  inputEl.addEventListener('input', function(){
    charCount.textContent = inputEl.value.length + ' / 200';
  });
  charCount.textContent = inputEl.value.length + ' / 200';

  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if(!b) return;
    inputEl.value = b.dataset.t;
    charCount.textContent = inputEl.value.length + ' / 200';
    inputEl.focus();
  });

  $('#speed').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    var s = parseFloat(b.dataset.s);
    clock.speed = (!isFinite(s) || s <= 0) ? 1 : s;
  });

  startBtn.addEventListener('click', run);
  skipBtn.addEventListener('click', function(){ clock.skip = true; });

  inputEl.addEventListener('keydown', function(e){
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ run(); }
  });
})();
</script>
